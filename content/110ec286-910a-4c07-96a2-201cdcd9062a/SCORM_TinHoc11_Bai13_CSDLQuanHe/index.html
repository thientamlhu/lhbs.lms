<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tin học 11 - Bài 13: Cơ sở dữ liệu quan hệ (SCORM Moodle)</title>
    <style>
      body { margin:0; font-family: system-ui, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
      .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 600px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
      h1 { font-size: 24px; color: #38bdf8; margin-bottom: 12px; }
      p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
      .btn { display: inline-block; background: #0284c7; color: white; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
      .btn:hover { background: #0369a1; }
      .status { margin-top: 16px; font-size: 13px; color: #10b981; }
    </style>
    <script>
      // Initialize SCORM API on load safely
      window.addEventListener('load', function() {
        var api = null;
        var win = window;
        var attempts = 0;
        while (win && attempts < 7) {
          try {
            if (win.API) {
              api = win.API;
              break;
            }
            if (win.parent && win.parent !== win) {
              win = win.parent;
            } else {
              break;
            }
          } catch(e) {
            break;
          }
          attempts++;
        }
        if (api) {
          try {
            api.LMSInitialize("");
            var student = api.LMSGetValue("cmi.core.student_name");
            if (student) {
              document.getElementById('scorm-status').innerText = "Đã kết nối tài khoản LMS Moodle: " + student;
            }
          } catch(e) {}
        }
      });
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Tin học 11: Bài 13 – Cơ sở dữ liệu quan hệ</h1>
      <p>Chào mừng bạn đến với bài học tương tác số. Hệ thống đã kết nối với sổ điểm Moodle LMS.</p>
      <a href="https://ais-dev-oy76526hw2yqlm4cfeagxd-786104488219.asia-east1.run.app" target="_blank" class="btn">MỞ PHẦN MỀM HỌC TẬP TƯƠNG TÁC</a>
      <div id="scorm-status" class="status">Đang chạy trong môi trường Moodle SCORM 1.2</div>
    </div>
  </body>
</html>
