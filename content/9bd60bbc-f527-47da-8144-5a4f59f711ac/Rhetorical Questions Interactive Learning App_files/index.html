<body>
    <div id="root"><div class="min-h-screen gradient-bg"><div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-2xl card-shadow p-8 w-full max-w-md"><div class="text-center mb-8"><div class="floating mb-4"><span class="text-5xl">📚</span></div><h1 class="text-4xl font-bold rainbow-text mb-3">Câu Hỏi Tu Từ</h1><p class="text-xl text-gray-600 font-semibold">Luyện Tập Lớp 8</p><div class="w-32 h-1 bg-gradient-to-r from-pink-500 to-blue-500 mx-auto mt-3 rounded-full"></div></div><form class="space-y-6"><div><label class="block text-sm font-bold text-gray-700 mb-2">📝 Họ và Tên</label><input type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-300" placeholder="Nhập họ và tên của bạn" required="" value="" fdprocessedid="wldlf"></div><div><label class="block text-sm font-bold text-gray-700 mb-2">🏫 Lớp</label><input type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-300" placeholder="Nhập lớp của bạn (ví dụ: 9A1)" required="" value="" fdprocessedid="b80ux"></div><button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 glow-button text-lg" fdprocessedid="6em7dg">🚀 Bắt Đầu Học Tập</button></form></div></div></div></div>

    <script type="text/babel">
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "demo-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "demo-app-id"
        };

        // Initialize Firebase (Demo mode - data stored locally)
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (error) {
            console.log("Firebase demo mode - using local storage");
        }

        const { useState, useEffect, useRef } = React;

        // Main App Component
        function App() {
            const [currentPage, setCurrentPage] = useState('login');
            const [studentData, setStudentData] = useState({
                fullName: '',
                className: '',
                startTime: null,
                totalScore: 0,
                activities: {
                    activity1: { completed: false, score: 0, retries: 0, timeSpent: 0 },
                    activity2: { completed: false, score: 0, retries: 0, timeSpent: 0 },
                    activity3: { completed: false, score: 0, retries: 0, timeSpent: 0 }
                },
                totalReplays: 0
            });

            const saveToDatabase = async (data) => {
                try {
                    // Demo mode - save to localStorage
                    const existingData = JSON.parse(localStorage.getItem('studentRecords') || '[]');
                    const newRecord = {
                        ...data,
                        timestamp: new Date().toISOString(),
                        id: Date.now().toString()
                    };
                    existingData.push(newRecord);
                    localStorage.setItem('studentRecords', JSON.stringify(existingData));
                    return true;
                } catch (error) {
                    console.error('Error saving data:', error);
                    return false;
                }
            };

            const getStudentRecords = () => {
                try {
                    return JSON.parse(localStorage.getItem('studentRecords') || '[]');
                } catch (error) {
                    return [];
                }
            };

            return (
                <div className="min-h-screen gradient-bg">
                    {currentPage === 'login' && (
                        <LoginPage 
                            onLogin={(name, className) => {
                                if (name === "THẦY CÔ THÔNG THÁI" && className === "GIÁO VIÊN NGỮ VĂN") {
                                    setCurrentPage('teacher');
                                } else {
                                    setStudentData(prev => ({
                                        ...prev,
                                        fullName: name,
                                        className: className,
                                        startTime: Date.now()
                                    }));
                                    setCurrentPage('main');
                                }
                            }}
                        />
                    )}
                    
                    {currentPage === 'teacher' && (
                        <TeacherPage 
                            records={getStudentRecords()}
                            onBack={() => setCurrentPage('login')}
                        />
                    )}
                    
                    {currentPage === 'main' && (
                        <MainPage 
                            studentData={studentData}
                            setStudentData={setStudentData}
                            onComplete={() => setCurrentPage('summary')}
                        />
                    )}
                    
                    {currentPage === 'summary' && (
                        <SummaryPage 
                            studentData={studentData}
                            onRestart={() => {
                                setStudentData(prev => ({
                                    fullName: prev.fullName,
                                    className: prev.className,
                                    startTime: Date.now(),
                                    totalScore: 0,
                                    activities: {
                                        activity1: { completed: false, score: 0, retries: 0, timeSpent: 0 },
                                        activity2: { completed: false, score: 0, retries: 0, timeSpent: 0 },
                                        activity3: { completed: false, score: 0, retries: 0, timeSpent: 0 }
                                    },
                                    totalReplays: prev.totalReplays + 1
                                }));
                                setCurrentPage('main');
                            }}
                            onFinish={async () => {
                                const success = await saveToDatabase(studentData);
                                if (success) {
                                    alert('🎉 Chúc mừng! Kết quả của bạn đã được lưu thành công!');
                                    setCurrentPage('login');
                                } else {
                                    alert('❌ Lỗi lưu dữ liệu. Vui lòng thử lại.');
                                }
                            }}
                        />
                    )}
                </div>
            );
        }

        // Login Page Component
        function LoginPage({ onLogin }) {
            const [fullName, setFullName] = useState('');
            const [className, setClassName] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (fullName.trim() && className.trim()) {
                    onLogin(fullName.trim(), className.trim());
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl card-shadow p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="floating mb-4">
                                <span className="text-5xl">📚</span>
                            </div>
                            <h1 className="text-4xl font-bold rainbow-text mb-3">Câu Hỏi Tu Từ</h1>
                            <p className="text-xl text-gray-600 font-semibold">Luyện Tập Lớp 8</p>
                            <div className="w-32 h-1 bg-gradient-to-r from-pink-500 to-blue-500 mx-auto mt-3 rounded-full"></div>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    📝 Họ và Tên
                                </label>
                                <input
                                    type="text"
                                    value={fullName}
                                    onChange={(e) => setFullName(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-300"
                                    placeholder="Nhập họ và tên của bạn"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    🏫 Lớp
                                </label>
                                <input
                                    type="text"

        // Activity 2: Practice Tasks
        function Activity2({ studentData, setStudentData, activityKey }) {
            const [currentTask, setCurrentTask] = useState(0);
            const [answers, setAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);
            const [startTime] = useState(Date.now());
            const activity = studentData.activities[activityKey];

            const tasks = [
                {
                    type: 'multiple-choice',
                    question: 'Đọc và chọn câu nào là câu hỏi tu từ:',
                    options: [
                        'A. Chiều nay bạn có đi học thêm không?',
                        'B. Ai mà không yêu thương cha mẹ mình?',
                        'C. Bạn đã đọc xong cuốn sách đó chưa?',
                        'D. Cho mình mượn cây bút được không?'
                    ],
                    correct: 1,
                    explanation: 'B đúng vì dùng hình thức câu hỏi để khẳng định rằng ai cũng yêu thương cha mẹ, không phải để hỏi thông tin.'
                },
                {
                    type: 'short-answer',
                    question: 'Đọc và trả lời: "Làm sao chúng ta có thể quên được những kỷ niệm tuổi thơ?" Đây có phải câu hỏi tu từ không? Tại sao?',
                    sampleAnswer: 'Có, vì dùng hình thức câu hỏi để khẳng định rằng chúng ta không thể quên những kỷ niệm tuổi thơ, không phải để hỏi thông tin.',
                    points: 5
                },
                {
                    type: 'fill-blanks',
                    question: 'Điền vào chỗ trống:',
                    blanks: [
                        'Câu hỏi tu từ có hình thức của câu hỏi và kết thúc bằng dấu ________.',
                        'Trong văn học, câu hỏi tu từ làm tăng tính ________, gợi nhiều ________, nâng cao hiệu quả ________.'
                    ],
                    answers: ['chấm hỏi (?)', 'biểu cảm', 'ý nghĩa', 'thẩm mỹ']
                },
                {
                    type: 'creative',
                    question: 'Viết HAI câu hỏi tu từ để:',
                    prompts: [
                        'Bày tỏ tình yêu thương gia đình',
                        'Phê phán một thói xấu trong đời sống'
                    ],
                    hints: [
                        'Ví dụ: "Ai mà không cần tình yêu thương và sự che chở của gia đình?"',
                        'Ví dụ: "Chúng ta có thể thờ ơ trước những người khó khăn được không?"'
                    ]
                }
            ];

            const calculateScore = () => {
                let score = 0;
                
                // Task 1: Multiple choice (10 points)
                if (answers[0] === 1) score += 10;
                
                // Task 2: Short answer (5 points if answered)
                if (answers[1] && answers[1].trim()) score += 5;
                
                // Task 3: Fill blanks (10 points - 2.5 each)
                if (answers[2]) {
                    const blanks = answers[2];
                    if (blanks[0] && blanks[0].toLowerCase().includes('question mark')) score += 2.5;
                    if (blanks[1] && blanks[1].toLowerCase().includes('expressiveness')) score += 2.5;
                    if (blanks[2] && blanks[2].toLowerCase().includes('meanings')) score += 2.5;
                    if (blanks[3] && blanks[3].toLowerCase().includes('aesthetic')) score += 2.5;
                }
                
                // Task 4: Creative writing (5 points if both answered)
                if (answers[3] && answers[3][0] && answers[3][1]) score += 5;
                
                return Math.round(score);
            };

            const handleComplete = () => {
                const score = calculateScore();
                const timeSpent = Date.now() - startTime;
                setStudentData(prev => ({
                    ...prev,
                    activities: {
                        ...prev.activities,
                        [activityKey]: {
                            ...prev.activities[activityKey],
                            completed: true,
                            score: score,
                            timeSpent: timeSpent
                        }
                    },
                    totalScore: prev.totalScore + score
                }));
                setShowResults(true);
            };

            const handleRetry = () => {
                setCurrentTask(0);
                setAnswers({});
                setShowResults(false);
                setStudentData(prev => ({
                    ...prev,
                    activities: {
                        ...prev.activities,
                        [activityKey]: {
                            ...prev.activities[activityKey],
                            completed: false,
                            retries: prev.activities[activityKey].retries + 1
                        }
                    },
                    totalScore: prev.totalScore - (activity.completed ? activity.score : 0)
                }));
            };

            if (activity.completed && showResults) {
                return (
                    <div className="text-center py-8">
                        <div className="bg-green-100 border border-green-300 rounded-lg p-6 max-w-md mx-auto">
                            <h3 className="text-xl font-semibold text-green-800 mb-2">✅ Activity Completed!</h3>
                            <p className="text-green-700 mb-4">Score: {activity.score}/30 points</p>
                            <button
                                onClick={handleRetry}
                                className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg"
                            >
                                🔄 Retry Activity
                            </button>
                        </div>
                    </div>
                );
            }

            const renderTask = (task, index) => {
                switch (task.type) {
                    case 'multiple-choice':
                        return (
                            <div className="space-y-4">
                                <p className="font-medium">{task.question}</p>
                                <div className="space-y-2">
                                    {task.options.map((option, optIndex) => (
                                        <label key={optIndex} className="flex items-center space-x-2 cursor-pointer">
                                            <input
                                                type="radio"
                                                name={`task-${index}`}
                                                value={optIndex}
                                                checked={answers[index] === optIndex}
                                                onChange={(e) => setAnswers(prev => ({
                                                    ...prev,
                                                    [index]: parseInt(e.target.value)
                                                }))}
                                                className="text-blue-600"
                                            />
                                            <span>{option}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        );
                    
                    case 'short-answer':
                        return (
                            <div className="space-y-4">
                                <p className="font-medium">{task.question}</p>
                                <textarea
                                    value={answers[index] || ''}
                                    onChange={(e) => setAnswers(prev => ({
                                        ...prev,
                                        [index]: e.target.value
                                    }))}
                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                    rows="3"
                                    placeholder="Write your answer here..."
                                />
                            </div>
                        );
                    
                    case 'fill-blanks':
                        return (
                            <div className="space-y-4">
                                <p className="font-medium">{task.question}</p>
                                {task.blanks.map((blank, blankIndex) => (
                                    <div key={blankIndex} className="space-y-2">
                                        <p>{blankIndex + 1}. {blank.split('________')[0]}</p>
                                        <input
                                            type="text"
                                            value={(answers[index] && answers[index][blankIndex]) || ''}
                                            onChange={(e) => {
                                                const newBlanks = [...(answers[index] || [])];
                                                newBlanks[blankIndex] = e.target.value;
                                                setAnswers(prev => ({
                                                    ...prev,
                                                    [index]: newBlanks
                                                }));
                                            }}
                                            className="w-full p-2 border border-gray-300 rounded"
                                            placeholder="Fill in the blank..."
                                        />
                                        <p>{blank.split('________')[1]}</p>
                                    </div>
                                ))}
                            </div>
                        );
                    
                    case 'creative':
                        return (
                            <div className="space-y-4">
                                <p className="font-medium">{task.question}</p>
                                {task.prompts.map((prompt, promptIndex) => (
                                    <div key={promptIndex} className="space-y-2">
                                        <p className="text-sm font-medium">• {prompt}:</p>
                                        <input
                                            type="text"
                                            value={(answers[index] && answers[index][promptIndex]) || ''}
                                            onChange={(e) => {
                                                const newAnswers = [...(answers[index] || [])];
                                                newAnswers[promptIndex] = e.target.value;
                                                setAnswers(prev => ({
                                                    ...prev,
                                                    [index]: newAnswers
                                                }));
                                            }}
                                            className="w-full p-2 border border-gray-300 rounded"
                                            placeholder="Write your rhetorical question..."
                                        />
                                        <p className="text-xs text-gray-500">Hint: {task.hints[promptIndex]}</p>
                                    </div>
                                ))}
                            </div>
                        );
                    
                    default:
                        return null;
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Practice Tasks</h2>
                        <span className="text-sm text-gray-500">Task {currentTask + 1} of {tasks.length}</span>
                    </div>

                    <div className="bg-gray-50 p-6 rounded-lg min-h-64">
                        <h3 className="text-lg font-semibold mb-4">Task {currentTask + 1}</h3>
                        {renderTask(tasks[currentTask], currentTask)}
                    </div>

                    <div className="flex justify-between">
                        <button
                            onClick={() => setCurrentTask(Math.max(0, currentTask - 1))}
                            disabled={currentTask === 0}
                            className="bg-gray-500 hover:bg-gray-600 disabled:bg-gray-300 text-white px-4 py-2 rounded-lg"
                        >
                            ← Previous
                        </button>
                        
                        {currentTask < tasks.length - 1 ? (
                            <button
                                onClick={() => setCurrentTask(currentTask + 1)}
                                className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg"
                            >
                                Next →
                            </button>
                        ) : (
                            <button
                                onClick={handleComplete}
                                className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg"
                            >
                                Complete Tasks ✓
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Activity 3: Creative Writing
        function Activity3({ studentData, setStudentData, activityKey }) {
            const [essays, setEssays] = useState(['', '', '']);
            const [startTime] = useState(Date.now());
            const activity = studentData.activities[activityKey];

            const prompts = [
                {
                    title: "Tình Yêu Gia Đình",
                    prompt: "Viết một đoạn văn ngắn (3-4 câu) về gia đình em, sử dụng ít nhất 2 câu hỏi tu từ để bày tỏ tình yêu thương và lòng biết ơn.",
                    example: "Ví dụ: 'Làm sao con có thể báo đáp được tình yêu vô bờ bến của cha mẹ? Còn ai hy sinh nhiều như vậy vì hạnh phúc của con?'"
                },
                {
                    title: "Bảo Vệ Môi Trường",
                    prompt: "Viết về việc bảo vệ môi trường, sử dụng câu hỏi tu từ để thuyết phục mọi người yêu thương thiên nhiên.",
                    example: "Ví dụ: 'Chúng ta không muốn có không khí trong lành để thở sao? Làm sao có thể phớt lờ tiếng kêu cứu của trái đất?'"
                },
                {
                    title: "Tình Bạn",
                    prompt: "Miêu tả tầm quan trọng của tình bạn, sử dụng câu hỏi tu từ để nhấn mạnh ý kiến của em.",
                    example: "Ví dụ: 'Cuộc sống sẽ ra sao nếu không có những người bạn chân thành? Còn ai hiểu chúng ta sâu sắc như vậy?'"
                }
            ];

            const calculateScore = () => {
                let score = 0;
                essays.forEach(essay => {
                    if (essay.trim().length > 50) { // Basic length check
                        score += 13; // Roughly 40/3 points per essay
                    }
                });
                return Math.min(score, 40); // Cap at 40 points
            };

            const handleComplete = () => {
                const score = calculateScore();
                const timeSpent = Date.now() - startTime;
                setStudentData(prev => ({
                    ...prev,
                    activities: {
                        ...prev.activities,
                        [activityKey]: {
                            ...prev.activities[activityKey],
                            completed: true,
                            score: score,
                            timeSpent: timeSpent
                        }
                    },
                    totalScore: prev.totalScore + score
                }));
            };

            const handleRetry = () => {
                setEssays(['', '', '']);
                setStudentData(prev => ({
                    ...prev,
                    activities: {
                        ...prev.activities,
                        [activityKey]: {
                            ...prev.activities[activityKey],
                            completed: false,
                            retries: prev.activities[activityKey].retries + 1
                        }
                    },
                    totalScore: prev.totalScore - (activity.completed ? activity.score : 0)
                }));
            };

            if (activity.completed) {
                return (
                    <div className="text-center py-8">
                        <div className="bg-green-100 border border-green-300 rounded-lg p-6 max-w-md mx-auto">
                            <h3 className="text-xl font-semibold text-green-800 mb-2">✅ Activity Completed!</h3>
                            <p className="text-green-700 mb-4">Score: {activity.score}/40 points</p>
                            <button
                                onClick={handleRetry}
                                className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg"
                            >
                                🔄 Retry Activity
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Creative Writing with Rhetorical Questions</h2>
                    
                    <div className="space-y-6">
                        {prompts.map((prompt, index) => (
                            <div key={index} className="bg-gray-50 p-6 rounded-lg">
                                <h3 className="text-lg font-semibold mb-3">{index + 1}. {prompt.title}</h3>
                                <p className="text-gray-700 mb-3">{prompt.prompt}</p>
                                <p className="text-sm text-blue-600 mb-4">{prompt.example}</p>
                                <textarea
                                    value={essays[index]}
                                    onChange={(e) => {
                                        const newEssays = [...essays];
                                        newEssays[index] = e.target.value;
                                        setEssays(newEssays);
                                    }}
                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                    rows="4"
                                    placeholder="Write your paragraph here..."
                                />
                                <div className="text-xs text-gray-500 mt-1">
                                    Characters: {essays[index].length}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="text-center">
                        <button
                            onClick={handleComplete}
                            disabled={essays.every(essay => essay.trim().length < 20)}
                            className="bg-green-500 hover:bg-green-600 disabled:bg-gray-300 text-white px-6 py-3 rounded-lg font-semibold"
                        >
                            Complete Creative Writing ✓
                        </button>
                    </div>
                </div>
            );
        }

        // Summary Page Component
        function SummaryPage({ studentData, onRestart, onFinish }) {
            const totalTimeSpent = Math.round((Date.now() - studentData.startTime) / 60000);
            const totalRetries = Object.values(studentData.activities).reduce((sum, act) => sum + act.retries, 0);

            return (
                <div className="min-h-screen p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl card-shadow p-8">
                            <div className="text-center mb-8">
                                <div className="floating mb-4">
                                    <span className="text-6xl">🎉</span>
                                </div>
                                <h1 className="text-5xl font-bold rainbow-text mb-4">Chúc Mừng!</h1>
                                <p className="text-2xl font-bold text-gray-800">{studentData.fullName}</p>
                                <p className="text-xl text-gray-600 font-semibold">Lớp: {studentData.className}</p>
                                <div className="w-40 h-1 bg-gradient-to-r from-green-500 to-blue-500 mx-auto mt-4 rounded-full"></div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-6 mb-8">
                                <div className="bg-gradient-to-br from-blue-100 to-cyan-100 p-6 rounded-2xl border-2 border-blue-200">
                                    <h3 className="text-xl font-bold text-blue-800 mb-4">📊 Tổng Kết Kết Quả</h3>
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">🎯 Tổng Điểm:</span>
                                            <span className="font-bold text-xl text-blue-600">{studentData.totalScore}/100</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">⏰ Thời Gian:</span>
                                            <span className="font-bold text-xl text-green-600">{totalTimeSpent} phút</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">🔄 Số Lần Thử Lại:</span>
                                            <span className="font-bold text-xl text-orange-600">{totalRetries}</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">🎮 Lần Chơi Lại:</span>
                                            <span className="font-bold text-xl text-purple-600">{studentData.totalReplays}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-br from-green-100 to-emerald-100 p-6 rounded-2xl border-2 border-green-200">
                                    <h3 className="text-xl font-bold text-green-800 mb-4">📈 Chi Tiết Điểm Số</h3>
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">🧠 Hình Thành Kiến Thức:</span>
                                            <span className="font-bold text-xl text-blue-600">{studentData.activities.activity1.score}/30</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">✏️ Bài Tập Thực Hành:</span>
                                            <span className="font-bold text-xl text-purple-600">{studentData.activities.activity2.score}/30</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-white p-3 rounded-xl">
                                            <span className="font-semibold">✨ Sáng Tác Văn Bản:</span>
                                            <span className="font-bold text-xl text-pink-600">{studentData.activities.activity3.score}/40</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-yellow-100 to-orange-100 p-8 rounded-2xl mb-8 border-2 border-yellow-200">
                                <h3 className="text-2xl font-bold text-yellow-800 mb-6 text-center">🌟 Xếp Loại Kết Quả</h3>
                                <div className="text-center">
                                    {studentData.totalScore >= 90 && (
                                        <div className="bounce-in">
                                            <div className="floating mb-4">
                                                <span className="text-5xl">🏆</span>
                                            </div>
                                            <span className="text-4xl font-bold text-green-600 rainbow-text">Xuất Sắc (A)</span>
                                            <p className="text-gray-700 mt-3 text-lg font-semibold">Hiểu biết tuyệt vời về câu hỏi tu từ!</p>
                                        </div>
                                    )}
                                    {studentData.totalScore >= 75 && studentData.totalScore < 90 && (
                                        <div className="bounce-in">
                                            <div className="floating mb-4">
                                                <span className="text-5xl">🥈</span>
                                            </div>
                                            <span className="text-4xl font-bold text-blue-600">Khá (B)</span>
                                            <p className="text-gray-700 mt-3 text-lg font-semibold">Nắm vững kiến thức tốt!</p>
                                        </div>
                                    )}
                                    {studentData.totalScore >= 60 && studentData.totalScore < 75 && (
                                        <div className="bounce-in">
                                            <div className="floating mb-4">
                                                <span className="text-5xl">🥉</span>
                                            </div>
                                            <span className="text-4xl font-bold text-yellow-600">Trung Bình (C)</span>
                                            <p className="text-gray-700 mt-3 text-lg font-semibold">Em đã hiểu cơ bản. Hãy tiếp tục luyện tập!</p>
                                        </div>
                                    )}
                                    {studentData.totalScore < 60 && (
                                        <div className="bounce-in">
                                            <div className="floating mb-4">
                                                <span className="text-5xl">📚</span>
                                            </div>
                                            <span className="text-4xl font-bold text-red-600">Cần Cố Gắng (D)</span>
                                            <p className="text-gray-700 mt-3 text-lg font-semibold">Hãy ôn lại bài và thử lần nữa!</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex justify-center space-x-6">
                                <button
                                    onClick={onRestart}
                                    className="bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white px-8 py-4 rounded-xl font-bold text-lg transition-all duration-300 transform hover:scale-105 glow-button"
                                >
                                    🔄 Làm Lại Tất Cả
                                </button>
                                <button
                                    onClick={onFinish}
                                    className="bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 text-white px-8 py-4 rounded-xl font-bold text-lg transition-all duration-300 transform hover:scale-105 glow-button"
                                >
                                    💾 Lưu & Hoàn Thành
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
