<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tọa độ điểm N trong không gian Oxyz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     Phong cách "trang giấy kẻ ô ly" — giấy kem, mực xanh than,
     màu trục làm điểm nhấn duy nhất. Không dùng số bước vì đây
     không phải một chuỗi bắt buộc mà là 4 trạng thái độc lập.
     ============================================================ */
  :root{
    --paper:#F6F2E7;
    --surface:#FFFEFA;
    --surface-2:#FCFAF2;
    --ink:#1F2A38;
    --ink-soft:#5B6472;
    --rule:#E1D9C4;
    --rule-strong:#CBBFA0;

    --axis-x:#C0392B;
    --axis-y:#2F7D4F;
    --axis-z:#2A5DAD;
    --teal:#17847A;
    --point-n:#E08A2C;

    --font-display:'Literata', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; padding:0;
    font-family:var(--font-body); color:var(--ink); background:var(--paper);
    overflow:hidden;
  }

  #app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  /* ---------- Thanh trên: chỉ tiêu đề ---------- */
  header{
    flex:0 0 auto;
    padding:12px 24px;
    border-bottom:1px solid var(--rule-strong);
    background:var(--surface);
  }
  header h1{
    font-family:var(--font-display); font-weight:600; font-size:16px; margin:0;
  }

  /* ---------- Hàng chính: mô hình 3D (trái) + cột điều khiển (phải) ----------
     Hai khu vực độc lập hoàn toàn (flex siblings) — cột điều khiển KHÔNG
     bao giờ đè lên hay bị Canvas che, vì nó không nằm trong #stage. */
  #main-row{ flex:1 1 auto; min-height:0; display:flex; }

  #stage{ position:relative; flex:1 1 auto; min-width:0; background:var(--surface-2); }
  #canvas-host{ position:absolute; inset:0; }
  #canvas-host canvas{ display:block; }

  /* ---------- Cột điều khiển bên phải ---------- */
  #side-panel{
    flex:0 0 320px;
    max-width:30%;
    margin:20px 28px 20px 0;
    padding:20px;
    background:var(--surface);
    border:1px solid var(--rule-strong);
    border-radius:14px;
    box-shadow:0 4px 16px rgba(31,42,56,.06);
    overflow-y:auto;
    display:flex; flex-direction:column; gap:18px;
  }
  .panel-group{ display:flex; flex-direction:column; gap:10px; }
  .panel-label{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
    color:var(--ink-soft); text-transform:uppercase; font-weight:600;
  }
  .panel-hr{ border:none; border-top:1px solid var(--rule); margin:0; }

  .act-btn{
    font-family:var(--font-body); font-weight:600; font-size:14px;
    padding:12px 16px; border-radius:10px; border:1.5px solid var(--rule-strong);
    background:var(--surface-2); color:var(--ink); cursor:pointer;
    transition:all .15s ease; text-align:left; width:100%;
  }
  .act-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .act-btn:active{ transform:translateY(1px); }
  .act-btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  #answer-title{
    font-family:var(--font-display); font-weight:600; font-size:14.5px; margin:0;
  }
  #answer-inputs{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:var(--font-display); font-style:italic; font-size:19px;
  }
  .ans-input{
    width:100%; max-width:56px; text-align:center; font-family:var(--font-mono);
    font-style:normal; font-size:16px; padding:9px 4px; border:1.5px solid var(--rule-strong);
    border-radius:8px; background:var(--surface-2); color:var(--ink);
  }
  .ans-input:focus{ outline:none; border-color:var(--teal); }
  #btn-check{
    font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:11px 16px; border-radius:10px; border:1.5px solid var(--teal);
    background:var(--teal); color:#fff; cursor:pointer; transition:all .15s ease;
  }
  #btn-check:hover{ background:#136a62; }
  #btn-retry{
    font-family:var(--font-body); font-weight:600; font-size:13px;
    padding:9px 14px; border-radius:9px; border:1.5px solid var(--rule-strong);
    background:var(--surface-2); color:var(--ink); cursor:pointer; margin-top:8px; width:100%;
  }
  #btn-retry:hover{ border-color:var(--teal); color:var(--teal); }

  #answer-feedback{ font-size:13px; line-height:1.6; min-height:1.2em; }
  #answer-feedback .fb-correct{ color:var(--axis-y); font-weight:700; }
  #answer-feedback .fb-wrong{ color:var(--axis-x); font-weight:700; }
  #answer-feedback .fb-detail{ margin-top:6px; font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); }
  #answer-feedback .fb-ok{ color:var(--axis-y); }
  #answer-feedback .fb-bad{ color:var(--axis-x); }
  #answer-feedback .fb-hint{ margin-top:6px; font-style:italic; color:var(--ink-soft); }

  @media (max-width:900px){
    #main-row{ flex-direction:column; }
    #stage{ flex:1 1 auto; min-height:260px; }
    #side-panel{ flex:0 0 auto; max-width:none; margin:14px 16px 16px; max-height:46vh; }
  }
  @media (max-height:700px){
    header{ padding:8px 22px; }
    #side-panel{ padding:16px; gap:14px; margin-top:14px; margin-bottom:14px; }
  }

  #hint-pill{
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    max-width:min(78%, 460px);
    font-family:var(--font-display); font-style:italic; font-weight:600; font-size:14px;
    line-height:1.4; text-align:center; color:var(--ink);
    background:rgba(255,254,250,.92); border:1px solid var(--rule-strong);
    border-radius:8px; padding:6px 16px; box-shadow:0 2px 8px rgba(31,42,56,.06);
    transition:opacity .3s ease;
  }

  #drag-tip{
    position:absolute; bottom:20px; left:20px;
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft);
    background:rgba(255,254,250,.85); border:1px solid var(--rule); border-radius:6px;
    padding:4px 9px; opacity:.85;
  }

  /* ---------- Thẻ công thức (chỉ hiện ở hoạt động "Hiển thị hình hộp") ---------- */
  #formula-card{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%) translateY(8px);
    background:var(--surface);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size:14px 14px; background-position:-1px -1px;
    border:1px solid var(--rule-strong); border-radius:12px;
    padding:12px 22px; box-shadow:0 6px 18px rgba(31,42,56,.10);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:var(--font-display); font-style:italic; font-size:19px;
    opacity:0; pointer-events:none; transition:opacity .35s ease, transform .35s ease;
    max-width:min(90%, 520px);
  }
  #formula-card.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #formula-card .line2{ font-size:15.5px; color:var(--ink-soft); }
  .vecsym{ position:relative; display:inline-block; padding-top:0.5em; margin:0 1px; }
  .vecsym::before{ content:''; position:absolute; top:0.08em; left:1px; right:6px; border-top:1.4px solid currentColor; }
  .vecsym::after{
    content:''; position:absolute; top:-0.01em; right:2px;
    border-style:solid; border-width:3px 0 3px 5px; border-color:transparent transparent transparent currentColor;
  }
  .c-x{ color:var(--axis-x); font-weight:600; }
  .c-y{ color:var(--axis-y); font-weight:600; }
  .c-z{ color:var(--axis-z); font-weight:600; }
  .op{ color:var(--ink-soft); font-style:normal; padding:0 2px; }

  @media (max-height:760px){
    header{ padding:8px 18px; }
    #formula-card{ padding:9px 18px; font-size:16px; }
    #formula-card .line2{ font-size:13.5px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Tọa độ điểm N trong không gian Oxyz</h1>
  </header>

  <div id="main-row">
    <div id="stage">
      <div id="canvas-host"></div>
      <div id="hint-pill"></div>
      <div id="drag-tip">Kéo N để di chuyển · giữ Shift để đổi độ cao</div>
      <div id="formula-card">
        <div class="line1"></div>
        <div class="line2"></div>
      </div>
    </div>

    <aside id="side-panel">
      <div class="panel-group">
        <div class="panel-label">Điều khiển mô phỏng</div>
        <button class="act-btn" data-act="observe">Quan sát</button>
        <button class="act-btn" data-act="box">Hiển thị hình hộp</button>
        <button class="act-btn" data-act="random">Thử điểm N khác</button>
        <button class="act-btn" data-act="free">Tự di chuyển N</button>
      </div>

      <hr class="panel-hr">

      <div class="panel-group">
        <p id="answer-title">Xác định tọa độ điểm N</p>
        <div id="answer-inputs">
          N(&nbsp;<input type="number" id="ans-x" class="ans-input" aria-label="x">&nbsp;;&nbsp;
          <input type="number" id="ans-y" class="ans-input" aria-label="y">&nbsp;;&nbsp;
          <input type="number" id="ans-z" class="ans-input" aria-label="z">&nbsp;)
        </div>
        <button id="btn-check">Kiểm tra</button>
      </div>

      <div class="panel-group">
        <div id="answer-feedback"></div>
        <button id="btn-retry" style="display:none;">Thử lại</button>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* =====================================================================
   MÔ PHỎNG TỌA ĐỘ ĐIỂM N — PHIÊN BẢN 4 HOẠT ĐỘNG (không chia 8 bước)
   Quy ước hệ trục: SGK (x,y,z) -> three.js (X=y, Y=z, Z=x)
   (Oz là trục đứng; Ox chạy chéo sâu; Oy chạy ngang phải — đúng phối
   cảnh sách giáo khoa, giữ nhất quán với bản 8-bước trước đó.)
   ===================================================================== */

function sgkToThree(x, y, z) { return new THREE.Vector3(y, z, x); }
function V(label) { return `<span class="vecsym">${label}</span>`; }

function createLabelSprite(text, { color = '#1F2A38', fontSize = 46, fontWeight = '600', italic = false, scale = 1 } = {}) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const pad = 20;
  const fontStyle = `${italic ? 'italic ' : ''}${fontWeight} ${fontSize}px Literata, serif`;
  ctx.font = fontStyle;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
  const h = fontSize + pad * 1.4;
  canvas.width = w; canvas.height = h;
  ctx.font = fontStyle;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(text, w / 2, h / 2 + 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  const baseScale = 0.014 * scale;
  sprite.scale.set(w * baseScale, h * baseScale, 1);
  sprite.renderOrder = 999;
  return sprite;
}

function placeCylinderBetween(mesh, start, end) {
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.scale.set(1, Math.max(len, 0.0001), 1);
  if (len > 0.0001) {
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    mesh.quaternion.copy(q);
  }
  mesh.visible = len > 0.0002;
}

function makeEdgeMesh(radius, color, opacity = 1) {
  const geo = new THREE.CylinderGeometry(radius, radius, 1, 10, 1, false);
  const mat = new THREE.MeshStandardMaterial({ color, transparent: opacity < 1, opacity, roughness: .45, metalness: .05 });
  return new THREE.Mesh(geo, mat);
}

function makeArrow(color, shaftR = 0.05, coneR = 0.14, coneH = 0.36) {
  const shaftMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .18, roughness: .4 });
  const coneMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .18, roughness: .4 });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, 1, 12), shaftMat);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(coneR, coneH, 16), coneMat);
  shaft.visible = false; cone.visible = false;
  return { shaft, cone, coneH };
}
function placeArrow(arrow, start, end) {
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();
  if (len < 0.02) { arrow.shaft.visible = false; arrow.cone.visible = false; return; }
  const dirN = dir.clone().normalize();
  const shaftEnd = end.clone().sub(dirN.clone().multiplyScalar(arrow.coneH * 0.85));
  placeCylinderBetween(arrow.shaft, start, shaftEnd);
  arrow.cone.position.copy(end.clone().sub(dirN.clone().multiplyScalar(arrow.coneH / 2)));
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirN);
  arrow.cone.quaternion.copy(q);
  arrow.shaft.visible = true; arrow.cone.visible = true;
}

/* ---------------------------------------------------------------------
   SceneManager — scene / camera / renderer / ánh sáng / OrbitControls
   --------------------------------------------------------------------- */
class SceneManager {
  constructor(host) {
    this.host = host;
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color('#FCFAF2');

    const w = host.clientWidth, h = host.clientHeight;
    this.camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 500);
    this.camera.position.set(15, 11, 16);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.setSize(w, h);
    host.appendChild(this.renderer.domElement);

    this.scene.add(new THREE.AmbientLight('#ffffff', 0.75));
    const dir = new THREE.DirectionalLight('#ffffff', 0.6); dir.position.set(10, 18, 8); this.scene.add(dir);
    const dir2 = new THREE.DirectionalLight('#cfe0ff', 0.25); dir2.position.set(-8, 6, -10); this.scene.add(dir2);

    this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
    this.controls.target.set(2.2, 2.2, 2.2);
    this.controls.enableDamping = true; this.controls.dampingFactor = 0.08;
    this.controls.enablePan = false;
    this.controls.minDistance = 8; this.controls.maxDistance = 34;
    this.controls.minPolarAngle = 0.35; this.controls.maxPolarAngle = Math.PI / 2 - 0.03;
    this.controls.update();

    window.addEventListener('resize', () => this.onResize());
    this.raycaster = new THREE.Raycaster();
    this.pointerNDC = new THREE.Vector2();
  }
  onResize() {
    const w = this.host.clientWidth, h = this.host.clientHeight;
    this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h);
  }
  render() { this.controls.update(); this.renderer.render(this.scene, this.camera); }
}

/* ---------------------------------------------------------------------
   AxisManager — CHỈ hiển thị PHẦN DƯƠNG của Ox, Oy, Oz (yêu cầu XXIV):
   mọi tia bắt đầu tại O và chỉ kéo dài theo chiều dương.
   --------------------------------------------------------------------- */
class AxisManager {
  constructor(scene) {
    this.LEN = 8;
    this.group = new THREE.Group(); scene.add(this.group);
    this._buildAxis(new THREE.Vector3(0, 0, this.LEN), 0xC0392B, 'x');  // Ox -> three Z
    this._buildAxis(new THREE.Vector3(this.LEN, 0, 0), 0x2F7D4F, 'y'); // Oy -> three X
    this._buildAxis(new THREE.Vector3(0, this.LEN, 0), 0x2A5DAD, 'z'); // Oz -> three Y

    const oLabel = createLabelSprite('O', { color: '#B33A2E', fontWeight: '700', fontSize: 46 });
    oLabel.position.set(-0.4, -0.12, -0.4);
    this.group.add(oLabel);
    const oDot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 20, 20), new THREE.MeshStandardMaterial({ color: '#B33A2E' }));
    this.group.add(oDot);
  }
  _buildAxis(posEnd, color, letter) {
    const origin = new THREE.Vector3(0, 0, 0);
    const line = makeEdgeMesh(0.026, color, 0.85);
    placeCylinderBetween(line, origin, posEnd); // CHỈ từ O tới đầu dương — không có phần âm
    this.group.add(line);

    const coneH = 0.38;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.115, coneH, 16), new THREE.MeshStandardMaterial({ color }));
    const dir = posEnd.clone().normalize();
    cone.position.copy(posEnd.clone().add(dir.clone().multiplyScalar(coneH / 2)));
    cone.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir));
    this.group.add(cone);

    const label = createLabelSprite(letter, { color: `#${color.toString(16).padStart(6, '0')}`, italic: true, fontWeight: '700', fontSize: 50 });
    label.position.copy(posEnd.clone().add(dir.clone().multiplyScalar(0.8)));
    this.group.add(label);
  }
}

/* ---------------------------------------------------------------------
   GridManager — lưới nhạt trên PHẦN DƯƠNG của cả ba mặt phẳng toạ độ
   (khớp với việc chỉ hiển thị phần dương của các trục — yêu cầu XXIV).
   --------------------------------------------------------------------- */
class GridManager {
  constructor(scene, size = 8) {
    this._buildPlane(scene, size, (i) => [i, 0, 0, i, 0, size], (i) => [0, 0, i, size, 0, i]);
    this._buildPlane(scene, size, (i) => [i, 0, 0, i, size, 0], (i) => [0, i, 0, size, i, 0]);
    this._buildPlane(scene, size, (i) => [0, 0, i, 0, size, i], (i) => [0, i, 0, 0, i, size]);
  }
  _buildPlane(scene, size, lineA, lineB) {
    const positions = [];
    for (let i = 0; i <= size; i++) { positions.push(...lineA(i)); positions.push(...lineB(i)); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({ color: 0xD9CFB4, transparent: true, opacity: 0.4, depthWrite: false });
    const mesh = new THREE.LineSegments(geo, mat);
    mesh.renderOrder = -1;
    scene.add(mesh);
  }
}

/* ---------------------------------------------------------------------
   GeometryManager — điểm N, 3 đoạn phụ trợ, hình hộp, A/B/C, vectơ
   --------------------------------------------------------------------- */
class GeometryManager {
  constructor(scene) {
    this.scene = scene;
    this.coord = { x: 3, y: 4, z: 3 };

    this.nMesh = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 24), new THREE.MeshStandardMaterial({ color: '#E08A2C', roughness: .35 }));
    scene.add(this.nMesh);
    this.nLabel = createLabelSprite('N', { color: '#E08A2C', fontWeight: '700', fontSize: 52 });
    scene.add(this.nLabel);

    // 3 đoạn phụ trợ độc lập, LUÔN hiển thị — mỗi đoạn nối N tới hình chiếu
    // của N trên mặt phẳng toạ độ đối diện, nên có điểm đầu/cuối rõ ràng và
    // đúng nghĩa "song song với 1 trục". Đây là 3 đối tượng RIÊNG, không
    // dùng chung với các cạnh hình hộp bên dưới.
    this.segX = makeEdgeMesh(0.045, '#17847A'); // N -> hình chiếu lên mặt Oyz (song song Ox)
    this.segY = makeEdgeMesh(0.045, '#17847A'); // N -> hình chiếu lên mặt Oxz (song song Oy)
    this.segZ = makeEdgeMesh(0.045, '#17847A'); // N -> hình chiếu lên mặt Oxy (song song Oz)
    scene.add(this.segX, this.segY, this.segZ);

    // 9 cạnh còn lại của hình hộp (ẩn cho tới khi vào hoạt động "Hiển thị hình hộp")
    const dirColor = { OA: '#C0392B', OB: '#2F7D4F', OC: '#2A5DAD',
      AD: '#2F7D4F', BD: '#C0392B', AE: '#2A5DAD', CE: '#C0392B', BF: '#2A5DAD', CF: '#2F7D4F' };
    this.boxEdges = {};
    Object.keys(dirColor).forEach((k) => {
      const m = makeEdgeMesh(0.03, dirColor[k], .55); m.visible = false; scene.add(m); this.boxEdges[k] = { mesh: m };
    });

    // Đỉnh phụ A, B, C (có nhãn) và D (không nhãn)
    this.helperDots = {};
    const vColor = { A: '#C0392B', B: '#2F7D4F', C: '#2A5DAD', D: '#8A9099' };
    ['A', 'B', 'C', 'D'].forEach((k) => {
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ color: vColor[k] }));
      dot.visible = false; scene.add(dot);
      let label = null;
      if (k !== 'D') { label = createLabelSprite(k, { color: vColor[k], fontWeight: '700', fontSize: 42 }); label.visible = false; scene.add(label); }
      this.helperDots[k] = { dot, label };
    });

    // Vectơ OA, OB, OC, ON (mũi tên) — chỉ hiện cùng hình hộp
    this.vectors = { OA: makeArrow('#C0392B'), OB: makeArrow('#2F7D4F'), OC: makeArrow('#2A5DAD'), ON: makeArrow('#17847A', 0.058, 0.16, 0.42) };
    Object.values(this.vectors).forEach((a) => scene.add(a.shaft, a.cone));

    this.refresh();
  }

  vertices() {
    const { x, y, z } = this.coord;
    return {
      O: sgkToThree(0, 0, 0), A: sgkToThree(x, 0, 0), B: sgkToThree(0, y, 0), C: sgkToThree(0, 0, z),
      D: sgkToThree(x, y, 0), E: sgkToThree(x, 0, z), F: sgkToThree(0, y, z), N: sgkToThree(x, y, z),
    };
  }

  refresh() {
    const v = this.vertices();
    this.nMesh.position.copy(v.N);
    this.nLabel.position.copy(v.N.clone().add(new THREE.Vector3(0.26, 0.33, 0.26)));

    // 3 đoạn phụ trợ: N -> hình chiếu lên mặt phẳng đối diện (luôn cập nhật, luôn hiện)
    placeCylinderBetween(this.segX, v.N, v.F); // // Ox
    placeCylinderBetween(this.segY, v.N, v.E); // // Oy
    placeCylinderBetween(this.segZ, v.N, v.D); // // Oz

    // Cạnh hình hộp: giữ nguyên trạng thái ẩn/hiện hiện tại khi định vị lại
    const pairs = { OA: ['O', 'A'], OB: ['O', 'B'], OC: ['O', 'C'], AD: ['A', 'D'], BD: ['B', 'D'],
      AE: ['A', 'E'], CE: ['C', 'E'], BF: ['B', 'F'], CF: ['C', 'F'] };
    const boxWasVisible = {};
    Object.entries(this.boxEdges).forEach(([k, e]) => { boxWasVisible[k] = e.mesh.visible; });
    Object.entries(this.boxEdges).forEach(([k, e]) => placeCylinderBetween(e.mesh, v[pairs[k][0]], v[pairs[k][1]]));
    Object.entries(this.boxEdges).forEach(([k, e]) => { e.mesh.visible = boxWasVisible[k]; });

    Object.entries(this.helperDots).forEach(([k, h]) => {
      h.dot.position.copy(v[k]);
      if (h.label) {
        const outward = v[k].clone().length() > 0.001 ? v[k].clone().normalize().multiplyScalar(0.4) : new THREE.Vector3();
        h.label.position.copy(v[k].clone().add(outward).add(new THREE.Vector3(0, 0.22, 0)));
      }
    });

    const vecWasVisible = {};
    Object.entries(this.vectors).forEach(([k, a]) => { vecWasVisible[k] = a.shaft.visible; });
    placeArrow(this.vectors.OA, v.O, v.A);
    placeArrow(this.vectors.OB, v.O, v.B);
    placeArrow(this.vectors.OC, v.O, v.C);
    placeArrow(this.vectors.ON, v.O, v.N);
    Object.entries(this.vectors).forEach(([k, a]) => { a.shaft.visible = vecWasVisible[k]; a.cone.visible = vecWasVisible[k]; });
  }

  setBoxVisible(vis) {
    Object.values(this.boxEdges).forEach((e) => { e.mesh.visible = vis; });
    Object.values(this.helperDots).forEach((h) => { h.dot.visible = vis; if (h.label) h.label.visible = vis; });
    Object.values(this.vectors).forEach((a) => { a.shaft.visible = vis; a.cone.visible = vis; });
    if (vis) this.refresh(); // đảm bảo định vị đúng ngay khi vừa bật
  }
}

/* ---------------------------------------------------------------------
   DragController — kéo N theo cả 3 chiều: kéo ngang (Ox, Oy mặc định),
   giữ Shift + kéo lên/xuống để đổi độ cao (Oz).
   --------------------------------------------------------------------- */
class DragController {
  constructor(app) {
    this.app = app;
    this.dragging = false;
    this.mode = 'horizontal';
    this.groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    this.heightPlane = new THREE.Plane();
    const dom = app.sceneMgr.renderer.domElement;
    dom.addEventListener('pointerdown', (e) => this.onDown(e));
    dom.addEventListener('pointermove', (e) => this.onMove(e));
    window.addEventListener('pointerup', () => this.onUp());
  }

  _updateNDC(e) {
    const rect = this.app.sceneMgr.renderer.domElement.getBoundingClientRect();
    this.app.sceneMgr.pointerNDC.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  }

  onDown(e) {
    this._updateNDC(e);
    const rc = this.app.sceneMgr.raycaster;
    rc.setFromCamera(this.app.sceneMgr.pointerNDC, this.app.sceneMgr.camera);
    if (!rc.intersectObject(this.app.geo.nMesh).length) return;
    this.dragging = true;
    this.app.sceneMgr.controls.enabled = false;
    this.mode = e.shiftKey ? 'height' : 'horizontal';
    const { z } = this.app.geo.coord;

    if (this.mode === 'horizontal') {
      this.groundPlane.constant = -z;
    } else {
      const nPos = this.app.geo.nMesh.position.clone();
      const camPos = this.app.sceneMgr.camera.position.clone();
      const normal = new THREE.Vector3().subVectors(camPos, nPos); normal.y = 0;
      if (normal.lengthSq() < 1e-6) normal.set(0, 0, 1);
      normal.normalize();
      this.heightPlane.setFromNormalAndCoplanarPoint(normal, nPos);
    }
  }

  onMove(e) {
    if (!this.dragging) return;
    this._updateNDC(e);
    const rc = this.app.sceneMgr.raycaster;
    rc.setFromCamera(this.app.sceneMgr.pointerNDC, this.app.sceneMgr.camera);
    const pt = new THREE.Vector3();
    const LIM = 7;
    if (this.mode === 'horizontal') {
      if (rc.ray.intersectPlane(this.groundPlane, pt)) {
        let y = Math.max(1, Math.round(THREE.MathUtils.clamp(pt.x, 0, LIM)));
        let x = Math.max(1, Math.round(THREE.MathUtils.clamp(pt.z, 0, LIM)));
        this.app.setCoord(x, y, this.app.geo.coord.z);
      }
    } else {
      if (rc.ray.intersectPlane(this.heightPlane, pt)) {
        let z = Math.max(1, Math.round(THREE.MathUtils.clamp(pt.y, 0, LIM)));
        this.app.setCoord(this.app.geo.coord.x, this.app.geo.coord.y, z);
      }
    }
  }

  onUp() {
    if (this.dragging) { this.dragging = false; this.app.sceneMgr.controls.enabled = true; }
  }
}

/* ---------------------------------------------------------------------
   App — điều phối 4 hoạt động (không phải 8 bước): quan sát / hình hộp /
   điểm N ngẫu nhiên / tự do di chuyển. Kéo N luôn hoạt động ở mọi lúc.
   --------------------------------------------------------------------- */
class App {
  constructor() {
    this.host = document.getElementById('canvas-host');
    this.sceneMgr = new SceneManager(this.host);
    this.axisMgr = new AxisManager(this.sceneMgr.scene);
    this.gridMgr = new GridManager(this.sceneMgr.scene);
    this.geo = new GeometryManager(this.sceneMgr.scene);
    this.drag = new DragController(this);

    this.hintEl = document.getElementById('hint-pill');
    this.formulaCard = document.getElementById('formula-card');
    this.formulaLine1 = this.formulaCard.querySelector('.line1');
    this.formulaLine2 = this.formulaCard.querySelector('.line2');
    this.buttons = [...document.querySelectorAll('.act-btn')];
    this.buttons.forEach((b) => b.addEventListener('click', () => this.onActivityClick(b.dataset.act)));

    // ---- Khu vực "Xác định tọa độ điểm N" ----
    this.ansX = document.getElementById('ans-x');
    this.ansY = document.getElementById('ans-y');
    this.ansZ = document.getElementById('ans-z');
    this.feedbackEl = document.getElementById('answer-feedback');
    this.btnCheck = document.getElementById('btn-check');
    this.btnRetry = document.getElementById('btn-retry');
    this.btnCheck.addEventListener('click', () => this.checkAnswer());
    this.btnRetry.addEventListener('click', () => this.retryAnswer());
    [this.ansX, this.ansY, this.ansZ].forEach((inp) => {
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.checkAnswer(); });
    });

    this.activity = 'observe';
    this.hints = {
      observe: 'Quan sát vị trí điểm N trong không gian. Kéo N (chấm cam) để thay đổi vị trí.',
      box: 'OA, OB, OC là ba cạnh xuất phát từ O; ON là đường chéo không gian của hình hộp.',
      random: 'Đây là một điểm N mới. N đã dịch chuyển bao nhiêu theo Ox, Oy, Oz so với trước?',
      free: 'Kéo tự do điểm N và quan sát ba đoạn song song với Ox, Oy, Oz thay đổi theo.',
    };

    this._render();
    this.setActivity('observe');
  }

  _render() { requestAnimationFrame(() => this._render()); this.sceneMgr.render(); }

  updateFormulaCard() {
    const { x, y, z } = this.geo.coord;
    this.formulaLine1.innerHTML = `${V('ON')} <span class="op">=</span> ${V('OA')} <span class="op">+</span> ${V('OB')} <span class="op">+</span> ${V('OC')}`;
    this.formulaLine2.innerHTML =
      `${V('ON')} = <span class="c-x">${x}</span>${V('i')} <span class="op">+</span> <span class="c-y">${y}</span>${V('j')} <span class="op">+</span> <span class="c-z">${z}</span>${V('k')}`;
  }

  // Mọi thay đổi toạ độ N (kéo hoặc random) đều đi qua đây -> nguồn dữ liệu
  // DUY NHẤT, và luôn xoá trạng thái câu trả lời cũ (yêu cầu XXIX/XXX).
  setCoord(x, y, z) {
    this.geo.coord = { x, y, z };
    this.geo.refresh();
    if (this.activity === 'box') this.updateFormulaCard();
    this.resetAnswerState();
  }

  // Toạ độ N ngẫu nhiên, LUÔN dương (x>0, y>0, z>0) và không quá gần O.
  randomPoint() {
    const pool = [2, 3, 4, 5, 6, 7];
    const pick = () => pool[Math.floor(Math.random() * pool.length)];
    return { x: pick(), y: pick(), z: pick() };
  }

  onActivityClick(act) {
    if (act === 'random') {
      const { x, y, z } = this.randomPoint();
      this.setCoord(x, y, z); // setCoord đã tự xoá trạng thái câu trả lời cũ
      this.setActivity('random');
    } else {
      this.setActivity(act);
    }
  }

  setActivity(act) {
    this.activity = act;
    this.buttons.forEach((b) => b.classList.toggle('active', b.dataset.act === act));
    const showBox = act === 'box';
    this.geo.setBoxVisible(showBox);
    this.hintEl.textContent = this.hints[act];
    this.formulaCard.classList.toggle('show', showBox);
    if (showBox) this.updateFormulaCard();
  }

  /* ---------------- Xác định tọa độ điểm N (tự kiểm tra) ---------------- */

  resetAnswerState() {
    this.ansX.value = ''; this.ansY.value = ''; this.ansZ.value = '';
    this.feedbackEl.innerHTML = '';
    this.btnRetry.style.display = 'none';
  }

  retryAnswer() { this.resetAnswerState(); this.ansX.focus(); }

  checkAnswer() {
    const raw = [this.ansX.value, this.ansY.value, this.ansZ.value];
    if (raw.some((v) => v === '')) {
      this.feedbackEl.innerHTML = '<span class="fb-hint">Hãy nhập đủ cả ba giá trị x, y, z.</span>';
      return;
    }
    const guess = raw.map((v) => Math.round(parseFloat(v)));
    const actual = [this.geo.coord.x, this.geo.coord.y, this.geo.coord.z];
    const ok = [guess[0] === actual[0], guess[1] === actual[1], guess[2] === actual[2]];

    if (ok[0] && ok[1] && ok[2]) {
      this.feedbackEl.innerHTML =
        `<span class="fb-correct">✓ Chính xác!</span><br>Tọa độ của điểm N là N(${actual[0]}; ${actual[1]}; ${actual[2]}).`;
      this.btnRetry.style.display = 'none';
      return;
    }

    const names = ['Hoành độ x', 'Tung độ y', 'Cao độ z'];
    const axisNames = ['Ox', 'Oy', 'Oz'];
    const detail = names.map((n, i) => `${n}: <span class="${ok[i] ? 'fb-ok' : 'fb-bad'}">${ok[i] ? 'đúng' : 'chưa đúng'}</span>`).join('<br>');
    const wrongAxes = axisNames.filter((_, i) => !ok[i]);
    const hint = wrongAxes.length === 3
      ? 'Hãy quan sát lại cả ba đoạn song song với Ox, Oy, Oz.'
      : `Hãy quan sát lại vị trí của N theo trục ${wrongAxes.join(', ')}.`;

    this.feedbackEl.innerHTML =
      `<span class="fb-wrong">✗ Chưa chính xác!</span>
       <div class="fb-detail">${detail}</div>
       <div class="fb-hint">${hint}</div>`;
    this.btnRetry.style.display = 'block';
  }
}

window.addEventListener('load', () => { window.__app = new App(); });
</script>
</body>
</html>
