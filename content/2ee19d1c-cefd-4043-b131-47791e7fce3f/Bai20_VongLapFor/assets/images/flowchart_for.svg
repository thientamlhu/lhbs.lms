<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradDecision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradAction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    SƠ ĐỒ KHỐI HOẠT ĐỘNG CÂU LỆNH LẶP FOR TRONG PYTHON
  </text>

  <!-- Start block -->
  <rect x="220" y="55" width="160" height="38" rx="19" fill="url(#gradHeader)" />
  <text x="300" y="79" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
    BẮT ĐẦU VÒNG LẶP
  </text>

  <!-- Arrow down -->
  <line x1="300" y1="93" x2="300" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision diamond: i còn phần tử? -->
  <polygon points="300,130 420,185 300,240 180,185" fill="url(#gradDecision)" />
  <text x="300" y="175" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
    Biến đếm còn
  </text>
  <text x="300" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
    giá trị trong dãy?
  </text>

  <!-- True branch: down to action block -->
  <line x1="300" y1="240" x2="300" y2="285" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <rect x="310" y="248" width="80" height="20" rx="4" fill="#ecfdf5" />
  <text x="350" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#059669">
    ĐÚNG (True)
  </text>

  <!-- Action block: execute statement -->
  <rect x="200" y="288" width="200" height="50" rx="8" fill="url(#gradAction)" />
  <text x="300" y="310" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
    Gán giá trị tiếp theo cho i
  </text>
  <text x="300" y="328" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
    &amp; Thực hiện Khối lệnh con
  </text>

  <!-- Loop back arrow -->
  <path d="M 200 313 L 130 313 L 130 185 L 175 185" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />
  <text x="145" y="245" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#059669" transform="rotate(-90 145,245)">
    Quay lại kiểm tra
  </text>

  <!-- False branch: right to end -->
  <line x1="420" y1="185" x2="510" y2="185" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <rect x="428" y="160" width="70" height="20" rx="4" fill="#fef2f2" />
  <text x="463" y="174" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">
    SAI (Hết dãy)
  </text>

  <!-- End block -->
  <rect x="515" y="165" width="70" height="40" rx="20" fill="#64748b" />
  <text x="550" y="190" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
    KẾT THÚC
  </text>

  <rect x="20" y="375" width="560" height="32" rx="6" fill="#e2e8f0" />
  <text x="300" y="396" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#334155">
    💡 Cú pháp Python: <tspan font-family="monospace" font-weight="bold" fill="#1e293b">for &lt;biến&gt; in &lt;vùng giá trị&gt;:</tspan> các lệnh bên trong bắt buộc phải thụt lề.
  </text>
</svg>