      /**

 * Fully compatible with Moodle LMS 2.x, 3.x, 4.x, 5.x
 * Supports nested iframes, popups, and secure sandbox environments
 */

    version: '1.2',
    api: null,
    isInitialized: false,

    findAPI: function(win) {
      var attempts = 0;
      var maxAttempts = 15;
      while (win && attempts < maxAttempts) {
        attempts++;
        try {
          if (win.API) {
            return win.API;
          }
          if (!win.parent || win.parent === win) {
            break;
          }
          win = win.parent;
        } catch (e) {
          // Cross-origin frame boundary encountered safely
          break;
        }
      }
      return null;
    },

    getAPI: function() {
      if (this.api) return this.api;
      try {
        if (typeof window === 'undefined') return null;
        if (window.API) {
          this.api = window.API;
          return this.api;
        }
        try {
          if (window.parent && window.parent !== window) {
            this.api = this.findAPI(window.parent);
            if (this.api) return this.api;
          }
        } catch (e) {}
        try {
          if (window.top && window.top !== window) {
            if (window.top.API) {
              this.api = window.top.API;
              return this.api;
            }
          }
        } catch (e) {}
        try {
          if (window.opener) {
            if (window.opener.API) {
              this.api = window.opener.API;
              return this.api;
            }
            this.api = this.findAPI(window.opener);
            if (this.api) return this.api;
          }
        } catch (e) {}
      } catch (e) {
        // Safe fallback
      }
      return this.api;
    },

    initialize: function() {
      var api = this.getAPI();
      if (api) {
        try {
          var res = api.LMSInitialize('');
          this.isInitialized = (res === 'true' || res === true);
          return this.isInitialized;
        } catch (e) {
          console.warn('LMSInitialize failed:', e);
        }
      }
      return false;
    },

    getValue: function(key) {
      var api = this.getAPI();
      if (api && this.isInitialized) {
        try {
          return api.LMSGetValue(key) || '';
        } catch (e) {}
      }
      return '';
    },

    setValue: function(key, val) {
      var api = this.getAPI();
      if (api && this.isInitialized) {
        try {
          var res = api.LMSSetValue(key, String(val));
          return (res === 'true' || res === true);
        } catch (e) {}
      }
      return false;
    },

    commit: function() {
      var api = this.getAPI();
      if (api && this.isInitialized) {
        try {
          return (api.LMSCommit('') === 'true');
        } catch (e) {}
      }
      return false;
    },

    finish: function() {
      var api = this.getAPI();
      if (api && this.isInitialized) {
        try {
          this.commit();
          var res = api.LMSFinish('') === 'true';
          this.isInitialized = false;
          return res;
        } catch (e) {}
      }
      return false;
    }
  };

  window.SCORM_WRAPPER = SCORM;

hs35 = "Kiệt"`,feedbackType:`warning`,feedbackTitle:`Cách này gặp rất nhiều hạn chế!`,feedbackText:`Nếu dùng 35 biến riêng biệt, khi số lượng học sinh thay đổi (ví dụ có thêm học sinh mới chuyển đến) em sẽ phải sửa lại toàn bộ mã nguồn. Việc duyệt qua từng tên bằng vòng lặp cũng là bất khả thi vì các tên biến không có cấu trúc thống nhất.`},{id:`option_list`,title:`Cách 2: Sử dụng một biến kiểu danh sách (List)`,code:`ds_hs = ["An", "Bình", "Nam", "Đức", "Yến", ..., "Kiệt"]`,feedbackType:`success`,feedbackTitle:`Tuyệt vời! Đây chính là lựa chọn tối ưu trong lập trình!`,feedbackText:`Kiểu dữ liệu danh sách (list) trong Python cho phép gom nhiều giá trị vào cùng một biến duy nhất. Ta có thể dễ dàng thêm bớt, sắp xếp và dùng vòng lặp để duyệt qua tất cả học sinh chỉ với vài dòng code!`}]},ut=[{id:`topic-1`,num:`1`,title:`Kiểu dữ liệu danh sách (List)`,summary:`Cú pháp tạo danh sách, chỉ số bắt đầu từ 0, phân biệt chỉ số & giá trị, độ dài len(), gán, xóa và ghép danh sách.`,sections:[{subTitle:`1. Khái niệm và Cú pháp`,content:`Danh sách trong Python là một dãy các giá trị (gọi là các phần tử) được đặt trong cặp ngoặc vuông [ ], phân tách nhau bởi dấu phẩy.
Một danh sách trong Python có thể chứa các phần tử thuộc **nhiều kiểu dữ liệu khác nhau**:`,codeExample:`# Ví dụ 1 trong SGK trang 111:
A = [1, 2, 3, 4, 5]                  # Danh sách gồm các số nguyên
B = [1.5, 2, "Python", "List", 0]     # Danh sách chứa số thực, số nguyên và xâu ký tự
empty_list = []                      # Danh sách rỗng`,notes:["Danh sách rỗng ký hiệu là `[]`, có **độ dài bằng 0**.",`Các phần tử trong danh sách được lưu trữ **có thứ tự** và **thay đổi được (mutable)**.`]},{subTitle:`2. Chỉ số (Index) và Truy cập phần tử`,content:`Trong Python, các phần tử của danh sách được đánh chỉ số **bắt đầu từ 0**.
- Phần tử đầu tiên có chỉ số là **0**.
- Phần tử cuối cùng có chỉ số là **len(A) - 1** (hoặc chỉ số âm **-1**).`,codeExample:`A = [1, 2, 3, 4, 5]
print(A[0])   # In ra: 1 (phần tử đầu tiên)
print(A[3])   # In ra: 4 (phần tử thứ 4)

B = [1.5, 2, "Python", "List", 0]
print(B[2])   # In ra: 'Python' (phần tử thứ ba, chỉ số 2)`,notes:[`Phân biệt: **Chỉ số** là vị trí của phần tử trong danh sách (bắt đầu từ 0), còn **Giá trị** là dữ liệu được lưu tại vị trí đó.`,"Chỉ số âm: `A[-1]` là phần tử cuối cùng, `A[-2]` là phần tử sát cuối."]},{subTitle:`3. Độ dài len(A) và Lỗi IndexError`,content:"Hàm **`len(A)`** trả về độ dài (tổng số phần tử) của danh sách A.\nNếu danh sách có $N$ phần tử thì chỉ số hợp lệ chỉ từ $0$ đến $N - 1$. Truy cập `A[len(A)]` sẽ gây **lỗi IndexError** nghiêm trọng!",codeExample:`A = [10, 20, 30, 40, 50, 60, 70, 80]  # Danh sách gồm 8 phần tử
print(len(A))  # In ra: 8

# Chỉ số hợp lệ: 0, 1, 2, 3, 4, 5, 6, 7
# Lệnh dưới đây gây lỗi:
# print(A[len(A)])  -> IndexError: list index out of range
# Cách truy cập đúng phần tử cuối:
print(A[len(A) - 1]) # In ra: 80`,notes:[`Nguyên nhân lỗi **IndexError**: Chỉ số được yêu cầu vượt ra ngoài phạm vi từ 0 đến len(A) - 1.`,`Khắc phục: Luôn kiểm tra điều kiện chỉ số $0 \\le i < len(A)$.`]},{subTitle:`4. Thay đổi giá trị và Xóa phần tử (del)`,content:"Danh sách trong Python có thể thay đổi linh hoạt các phần tử:\n- Thay đổi bằng phép gán: `A[i] = giá_trị_mới`\n- Xóa bằng lệnh: `del A[i]` (xóa phần tử tại vị trí $i$, danh sách co lại, **độ dài giảm 1**).",codeExample:`# Mô phỏng ví dụ SGK trang 112:
A = [1, 2, 3, 4, 5]
A[1] = "One"        # Thay phần tử tại chỉ số 1 bằng "One"
print(A)            # Kết quả: [1, 'One', 3, 4, 5]

del A[4]            # Xóa phần tử tại chỉ số 4 (giá trị 5)
print(A)            # Kết quả: [1, 'One', 3, 4]`,notes:["Sau khi dùng `del A[i]`, các phần tử đứng sau vị trí $i$ sẽ tự động lùi chỉ số xuống 1 đơn vị.","Độ dài `len(A)` **giảm đi 1** sau mỗi lệnh `del`."]},{subTitle:`5. Ghép hai danh sách bằng toán tử +`,content:"Toán tử **`+`** dùng để nối (ghép) hai danh sách với nhau tạo thành một **danh sách mới**, không làm thay đổi các danh sách ban đầu.",codeExample:`A = [1, 2, 3]
B = [4, 5]
C = A + B
print(C)  # Kết quả: [1, 2, 3, 4, 5]
print(A)  # A vẫn là: [1, 2, 3]`,notes:["Toán tử `+` chỉ ghép được hai danh sách với nhau. Lệnh `A + 10` sẽ gây lỗi **`TypeError`** vì số 10 không phải là danh sách. Muốn thêm số 10 vào đầu, ta dùng `[10] + A`."]}]},{id:`topic-2`,num:`2`,title:`Duyệt các phần tử của danh sách`,summary:`Sử dụng vòng lặp for kết hợp hàm range(), ứng dụng tính tổng số dương, đếm số dương và lọc số chẵn.`,sections:[{subTitle:`1. Vòng lặp for duyệt theo chỉ số`,content:"Để duyệt qua tất cả các phần tử của danh sách A, ta kết hợp vòng lặp **`for`** với hàm **`range(len(A))`**.\nBiến chạy `i` sẽ lần lượt nhận các giá trị chỉ số từ $0$ đến $len(A) - 1$, và phần tử tương ứng là `A[i]`.",codeExample:`# Ví dụ SGK trang 112:
A = [1, 2, 3, 4, 5]
for i in range(len(A)):
    print(A[i], end=" ")
# Kết quả in trên một dòng: 1 2 3 4 5`,notes:['Tham số `end=" "` trong lệnh `print()` giúp các giá trị được in ra cách nhau bởi dấu cách thay vì xuống dòng.',"Duyệt một đoạn con: `range(start, stop)` duyệt các chỉ số từ `start` đến `stop - 1`."]},{subTitle:`2. Duyệt đoạn con trong danh sách`,content:"Xét danh sách: `A = [3, 2, 1, 5, 6, 10, 7, 12, 18]`\nKhi dùng `range(2, 5)`, biến `i` lần lượt nhận các chỉ số **2, 3, 4** (dừng trước 5).",codeExample:`A = [3, 2, 1, 5, 6, 10, 7, 12, 18]
for i in range(2, 5):
    print(A[i], end=" ")
# Chỉ số 2: A[2] = 1
# Chỉ số 3: A[3] = 5
# Chỉ số 4: A[4] = 6
# Kết quả in ra: 1 5 6`,notes:["`range(2, 5)` chỉ sinh ra các giá trị **2, 3, 4** (dừng trước 5)."]},{subTitle:`3. Ứng dụng SGK: Tính tổng và Đếm số dương`,content:`Dưới đây là 2 thuật toán cơ bản xuất hiện trong SGK trang 113:`,codeExample:`# Ứng dụng 1: Tính tổng các phần tử dương
A = [3, -2, 5, 0, -7, 8, 4]
tong = 0
for i in range(len(A)):
    if A[i] > 0:
        tong += A[i]
print("Tổng các số dương là:", tong)  # 3 + 5 + 8 + 4 = 20

# Ứng dụng 2: Đếm số lượng phần tử dương
dem = 0
for i in range(len(A)):
    if A[i] > 0:
        dem += 1
print("Số lượng phần tử dương là:", dem)  # 4`,notes:["Biến `tong` và `dem` cần được **khởi tạo bằng 0** trước khi bước vào vòng lặp.","Tương tự, để in các số chẵn, ta kiểm tra điều kiện `if A[i] % 2 == 0:`."]}]},{id:`topic-3`,num:`3`,title:`Thêm phần tử bằng phương thức append()`,summary:`Phương thức append(), tăng độ dài thêm 1, so sánh với toán tử ghép danh sách và thao tác xóa.`,sections:[{subTitle:`1. Phương thức append()`,content:"Phương thức **`A.append(x)`** sẽ thêm phần tử `x` vào **cuối** danh sách `A`.\nĐộ dài của danh sách sau khi gọi `append()` sẽ **tăng thêm 1**.",codeExample:`# Ví dụ 1 SGK trang 113:
A = [1, 2]
A.append(10)
print(A)       # Kết quả: [1, 2, 10]
print(len(A))  # Kết quả: 3`,notes:["Cú pháp: `tên_danh_sách.append(giá_trị)`","**Không gán** `A = A.append(10)` vì hàm `append()` thay đổi danh sách **tại chỗ (in-place)** và trả về `None`."]},{subTitle:`2. Phối hợp append() và del`,content:`Xét ví dụ SGK trang 113 khi kết hợp thêm phần tử vào cuối và xóa phần tử ở vị trí bất kỳ:`,codeExample:`A = [2, 4, 10, 1, 0]
A.append(100)      # Thêm 100 vào cuối -> [2, 4, 10, 1, 0, 100]
del A[1]           # Xóa phần tử tại chỉ số 1 (giá trị 4)
print(A)           # Kết quả cuối cùng: [2, 10, 1, 0, 100]`,notes:[`Ban đầu A có **5 phần tử**.`,"Sau `append(100)`: độ dài là **6**.","Sau `del A[1]`: độ dài trở lại là **5**."]},{subTitle:`3. So sánh các thao tác then chốt`,content:`Bảng đối chiếu 3 thao tác danh sách quan trọng nhất trong Bài 22:`,codeExample:`# 1. Thêm vào cuối (thao tác trực tiếp):
A.append(x)    # Thay đổi danh sách A, thêm x vào cuối

# 2. Thêm vào đầu (tạo danh sách mới):
B = [x] + A    # Tạo danh sách mới B có x ở đầu

# 3. Xóa phần tử tại chỉ số i:
del A[i]       # Thay đổi trực tiếp, xóa phần tử tại chỉ số i`,notes:["**Thao tác tại chỗ (in-place):** `append()`, `del` làm biến đổi trực tiếp danh sách hiện tại.","**Thao tác tạo mới:** Phép cộng `[x] + A` hoặc `A + B` không làm đổi các danh sách gốc mà tạo ra một danh sách mới hoàn toàn."]}]}],dt=`/app/applet/src/components/ObjectivesSection.tsx`,ft=({onStartLesson:e,onNavigateSection:t})=>(0,F.jsxDEV)(`div`,{className:`space-y-6`,children:[(0,F.jsxDEV)(`div`,{className:`bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4`,children:[(0,F.jsxDEV)(`div`,{children:[(0,F.jsxDEV)(`span`,{className:`inline-block px-2.5 py-1 text-xs font-semibold bg-blue-50 text-blue-700 rounded-md mb-1`,children:`Giai đoạn 1`},void 0,!1,{fileName:dt,lineNumber:20,columnNumber:11},void 0),(0,F.jsxDEV)(`h3`,{className:`text-xl font-bold text-slate-800 flex items-center gap-2`,children:[(0,F.jsxDEV)(ze,{className:`w-5 h-5 text-blue-600`},void 0,!1,{fileName:dt,lineNumber:24,columnNumber:13},void 0),(0,F.jsxDEV)(`span`,{children:`Mục Tiêu & Yêu Cầu Cần Đạt (Bài 22 SGK)`},void 0,!1,{fileName:dt,lineNumber:25,columnNumber:13},void 0)]},void 0,!0,{fileName:dt,lineNumber:23,columnNumber:11},void 0),(0,F.jsxDEV)(`p`,{className:`text-base text-slate-600`,children:`Học sinh cần nắm vững 9 mục tiêu sau khi hoàn thành bài học để đạt chuẩn đánh giá GDPT 2018.`},void 0,!1,{fileName:dt,lineNumber:27,columnNumber:11},void 0)]},void 0,!0,{fileName:dt,lineNumber:19,columnNumber:9},void 0),(0,F.jsxDEV)(`button`,{onClick:e,className:`flex items-center gap-2 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition cursor-pointer self-start md:self-auto`,children:[(0,F.jsxDEV)(`span`,{children:`Bắt đầu bài học`},void 0,!1,{fileName:dt,lineNumber:36,columnNumber:11},void 0),(0,F.jsxDEV)(D,{className:`w-4 h-4`},void 0,!1,{fileName:dt,lineNumber:37,columnNumber:11},void 0)]},void 0,!0,{fileName: ame:`relative`,children:[(0,F.jsxDEV)(ye,{className:`w-4 h-4 text-slate-400 absolute left-3 top-3`},void 0,!1,{fileName:q,lineNumber:281,columnNumber:19},void 0),(0,F.jsxDEV)(`input`,{type:`password`,value:c,onChange:e=>l(e.target.value),placeholder:`Nhập mã PIN giáo viên (Mặc định: GV2026)`,className:`w-full pl-9 pr-4 py-2.5 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none`},void 0,!1,{fileName:q,lineNumber:282,columnNumber:19},void 0)]},void 0,!0,{fileName:q,lineNumber:280,columnNumber:17},void 0),u&&(0,F.jsxDEV)(`p`,{className:`text-xs text-rose-600 font-medium`,children:u},void 0,!1,{fileName:q,lineNumber:292,columnNumber:19},void 0),(0,F.jsxDEV)(`button`,{type:`submit`,className:`w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition cursor-pointer`,children:`Đăng nhập Dashboard Quản lý`},void 0,!1,{fileName:q,lineNumber:295,columnNumber:17},void 0)]},void 0,!0,{fileName:q,lineNumber:279,columnNumber:15},void 0)]},void 0,!0,{fileName:q,lineNumber:270,columnNumber:13},void 0)},void 0,!1,{fileName:q,lineNumber:268,columnNumber:9},void 0)]},void 0,!0,{fileName:q,lineNumber:75,columnNumber:5},void 0)};function on(e,t){let n=(e||``).toLowerCase().trim();return n.includes(`indexerror`)||n.includes(`lỗi`)&&(n.includes(`chỉ số`)||n.includes(`vượt`))?'### ⚠️ Lỗi IndexError: list index out of range trong Python\n\n**1. Nguyên nhân:**\nLỗi này xảy ra khi em cố gắng truy cập một phần tử tại vị trí chỉ số **nằm ngoài phạm vi hợp lệ** của danh sách.\n\nTrong Python:\n- Danh sách có $n$ phần tử (`len(A) = n`) thì chỉ số dương hợp lệ là từ **`0` đến `n - 1`**.\n- Chỉ số âm hợp lệ là từ **`-n` đến `-1`**.\n- Nếu em gọi `A[n]` (ví dụ: `A[len(A)]`) hoặc một số lớn hơn, Python sẽ báo ngay lỗi:\n```python\nA = [1.5, 2, "Python"]  # Có 3 phần tử: chỉ số 0, 1, 2\nprint(A[3])  # ❌ Gây lỗi: IndexError: list index out of range!\n```\n\n**2. Cách khắc phục:**\n- Nhớ rằng phần tử cuối cùng luôn có chỉ số là `len(A) - 1` hoặc dùng `A[-1]`.\n- Khi duyệt bằng vòng lặp, luôn dùng `range(len(A))` (vì `range(n)` sẽ dừng trước $n$, tức là chạy đến $n - 1$).':n.includes(`0`)&&(n.includes(`bắt đầu`)||n.includes(`đầu tiên`)||n.includes(`tại sao`)||n.includes(`chỉ số`))?'### 🎯 Tại sao chỉ số danh sách trong Python lại bắt đầu từ 0?\n\nTrong hầu hết các ngôn ngữ lập trình hiện đại (Python, C/C++, Java...), chỉ số không chỉ là "số thứ tự" mà là **khoảng cách dịch chuyển (offset)** từ vị trí bắt đầu của danh sách trong bộ nhớ RAM:\n\n1. **Phần tử đầu tiên** nằm ngay tại vị trí khởi đầu của danh sách $\\rightarrow$ khoảng cách dịch là **0** $\\rightarrow$ ký hiệu là **`A[0]`**.\n2. **Phần tử thứ hai** cách đầu danh sách 1 ô nhớ $\\rightarrow$ ký hiệu là **`A[1]`**.\n3. **Phần tử thứ $k$** sẽ có chỉ số là **`k - 1`**.\n\n> 💡 **Quy tắc vàng SGK Tin học 10:**\n> Danh sách có độ dài `len(A) = n` thì:\n> - Phần tử đầu tiên: `A[0]`\n> - Phần tử cuối cùng: `A[n - 1]` (hoặc viết tắt là `A[-1]`).':n.includes(`chỉ số âm`)||n.includes(`-1`)||n.includes(`âm`)&&n.includes(`chỉ số`)?`### 🔍 Ý nghĩa của chỉ số âm trong Python:

Python có tính năng rất thuận tiện: cho phép đánh chỉ số **ngược từ cuối danh sách về đầu**:

- **\`A[-1]\`**: Phần tử **cuối cùng** của danh sách.
- **\`A[-2]\`**: Phần tử **sát cuối** (áp chót).
- **\`A[-len(A)]\`**: Phần tử **đầu tiên** (tương đương \`A[0]\`).

**Ví dụ thực tế (Danh sách B trong SGK):**
\`\`\`python
B = [1.5, 2, "Python", "List", 0]
print(B[-1])  # 👉 Kết quả: 0 (phần tử cuối)
print(B[-2])  # 👉 Kết quả: 'List'
print(B[-5])  # 👉 Kết quả: 1.5 (phần tử đầu tiên)
\`\`\`
✨ *Lợi ích:* Giúp em lấy ngay phần tử cuối cùng mà không cần phải viết dài dòng \`A[len(A) - 1]\`.`:n.includes(`append`)&&(n.includes(`+`)||n.includes(`khác`)||n.includes(`ghép`)||n.includes(`toán tử`))?"### ⚖️ Phân biệt phương thức `append()` và phép ghép `+`:\n\n| Tiêu chí | `A.append(x)` | Phép ghép `A + B` hoặc `[x] + A` |\n| :--- | :--- | :--- |\n| **Bản chất** | Thêm 1 phần tử `x` vào **cuối** danh sách hiện tại. | Ghép hai danh sách để tạo ra một **danh sách MỚI**. |\n| **Biến đổi** | Làm thay đổi trực tiếp danh sách `A`. | Danh sách cũ không đổi, kết quả cần gán vào biến mới. |\n| **Thêm ở đầu** | Không làm được. | Dùng `[x] + A` để thêm phần tử `x` vào đầu danh sách. |\n\n**Ví dụ minh họa:**\n```python\nA = [1, 2]\nA.append(3)\nprint(A)  # 👉 [1, 2, 3] (A bị thay đổi trực tiếp)\n\nB = [0] + A\nprint(B)  # 👉 [0, 1, 2, 3] (Danh sách mới được tạo ra)\nprint(A)  # 👉 [1, 2, 3] (A ban đầu vẫn giữ nguyên)\n```":n.includes(`append`)||n.includes(`thêm`)&&n.includes(`cuối`)?`### ➕ Phương thức \`append()\` trong Python:

- **Cú pháp:** \`A.append(giá_trị)\`
- **Tác dụng:** Bổ sung phần tử \`giá_trị\` vào vị trí **cuối cùng** của danh sách \`A\`.
- **Độ dài:** Làm độ dài \`len(A)\` tăng lên 1 đơn vị.

\`\`\`python
trai_cay = ["Táo", "Cam"]
trai_cay.append("Chuối")
print(trai_cay)  # 👉 ['Táo', 'Cam', 'Chuối']
print(len(trai_cay))  # 👉 3
\`\`\``:n.includes(`del`)||n.includes(`xóa`)?"### 🗑️ Lệnh xóa `del` trong Python (SGK trang 113):\n\n- **Cú pháp:** `del A[i]`\n- **Tác dụng:** Xóa phần tử tại **chỉ số `i`** trong danh sách `A`.\n- **Hiện tượng dồn ô nhớ:** Sau khi xóa, tất cả các phần tử phía sau vị trí `i` sẽ tự động dồn về phía trước 1 bước, và độ dài `len(A)` giảm đi 1.\n\n```python\nA = [10, 20, 30, 40]\ndel A[1]  # Xóa phần tử tại chỉ số 1 (giá trị 20)\nprint(A)  # 👉 [10, 30, 40]\nprint(A[1])  # 👉 30 (phần tử 30 đã dồn lên vị trí chỉ số 1)\n```":n.includes(`for`)||n.includes(`range`)||n.includes(`duyệt`)?'### 🔄 Duyệt danh sách bằng vòng lặp `for` và `range`:\n\nTrong SGK Tin học 10 Bài 22, có 2 cách phổ biến để duyệt qua danh sách:\n\n**Cách 1: Duyệt theo chỉ số (Dùng khi cần biết vị trí hoặc thay đổi giá trị)**\n```python\nA = [1.5, 2, "Python", "List", 0]\nfor i in range(len(A)):\n    print("Vị trí", i, "chứa giá trị:", A[i])\n```\n*Giải thích:* `range(len(A))` sinh dãy số từ `0` đến `len(A) - 1`.\n\n**Cách 2: Duyệt trực tiếp qua từng phần tử (Dùng khi chỉ cần đọc giá trị)**\n```python\nfor x in A:\n    print(x, end=" ")\n```':n.includes(`max`)||n.includes(`lớn nhất`)||n.includes(`min`)||n.includes(`nhỏ nhất`)?`### 🏆 Thuật toán tìm phần tử lớn nhất và chỉ số (SGK trang 114):

\`\`\`python
A = [3, 9, 2, 9, 5]

# Bước 1: Khởi tạo giá trị lớn nhất tạm thời

        max_val = A[i]
        max_idx = i

print("Chỉ số xuất hiện đầu tiên:", max_idx)
