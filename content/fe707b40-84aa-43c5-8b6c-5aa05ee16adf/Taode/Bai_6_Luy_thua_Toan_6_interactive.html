const slides=[
{cover:true,html:`<div class="content"><div><div class="logo">6</div><div class="title">LŨY THỪA VỚI SỐ MŨ TỰ NHIÊN</div><div class="subtitle">TOÁN 6 · BÀI 6</div><p style="font-size:1.35vw">Bài giảng điện tử tương tác</p></div><div class="cover-art"><div class="pieces"><div class="piece p1">♟</div><div class="piece p2">♞</div><div class="piece p3">♜</div></div></div></div>`},
{html:`<div class="content"><span class="section">MỤC TIÊU BÀI HỌC</span><div class="grid3" style="margin-top:2vw"><div class="card"><div class="kpi">01</div><div class="body">Thực hiện phép <b>nâng lên lũy thừa</b> với số mũ tự nhiên.</div></div><div class="card"><div class="kpi">02</div><div class="body">Nhận biết và thực hiện <b>nhân, chia hai lũy thừa cùng cơ số</b>.</div></div><div class="card"><div class="kpi">03</div><div class="body">Giải quyết một số vấn đề thực tiễn bằng phép tính lũy thừa.</div></div></div><div class="note" style="margin-top:1.5vw">Từ một bàn cờ vua, ta sẽ khám phá cách viết ngắn gọn cho những phép nhân lặp lại.</div></div>`},
{question:true,html:`<div class="content"><span class="badge">KHỞI ĐỘNG</span><div class="hero"><div><div class="title" style="font-size:3.2vw">Hạt thóc trên bàn cờ vua</div><p class="body">Theo truyền thuyết Ấn Độ, phần thưởng cho người phát minh ra bàn cờ vua là số thóc rải trên 64 ô: ô sau có số hạt <b>gấp đôi</b> ô trước.</p><div class="note">Ô 1: 1 hạt · Ô 2: 2 hạt · Ô 3: 4 hạt · Ô 4: 8 hạt · ...</div><p class="body"><b>Câu hỏi:</b> Ô thứ 8 có bao nhiêu hạt thóc?</p><div class="quiz" data-q="64"><button class="option" data-v="16">16</button><button class="option" data-v="64">64</button><button class="option" data-v="128">128</button><button class="option" data-v="256">256</button></div><div class="feedback"></div></div><div class="center"><div class="chess">${'<i></i>'.repeat(64)}</div><div class="small" style="margin-top:1vw">Mỗi ô sau gấp đôi ô trước</div></div></div></div>`},
{html:`<div class="content"><span class="section">1. LŨY THỪA VỚI SỐ MŨ TỰ NHIÊN</span><div class="grid2" style="margin-top:1.3vw;align-items:center"><div><h2 style="font-size:2.5vw">Phép nâng lên lũy thừa</h2><p class="body">Tích của nhiều thừa số bằng nhau có thể viết gọn bằng một lũy thừa.</p><div class="formulaBox formula">\\(a^n=\\underbrace{a\\cdot a\\cdot\\ldots\\cdot a}_{n\\text{ thừa số}}\\)</div><p class="body">Trong \\(a^n\\): <b>\\(a\\)</b> là <b>cơ số</b>, <b>\\(n\\)</b> là <b>số mũ</b>.</p></div><div class="object" style="position:relative"><span style="font-size:6vw">a<sup>n</sup></span><span style="position:absolute;right:10%;top:8%;font-size:2vw;color:#ef3d32">×</span><span style="position:absolute;left:10%;bottom:8%;font-size:2vw;color:#ff9f1c">+</span></div></div><div class="note" style="margin-top:1vw">Phép nhân nhiều thừa số bằng nhau gọi là <b>phép nâng lên lũy thừa</b>.</div></div>`},
{question:true,html:`<div class="content"><span class="section">HOẠT ĐỘNG 1 · NHẬN DIỆN</span><h2 style="font-size:2.4vw">Trong tích \\(3\\cdot3\\cdot3\\cdot3\\cdot3\\), cơ số và số mũ là gì?</h2><div class="quiz" data-q="3;5"><button class="option" data-v="3;5">Cơ số 3, số mũ 5</button><button class="option" data-v="5;3">Cơ số 5, số mũ 3</button><button class="option" data-v="3;3">Cơ số 3, số mũ 3</button><button class="option" data-v="5;5">Cơ số 5, số mũ 5</button></div><div class="feedback"></div></div>`},
{html:`<div class="content"><span class="section">VÍ DỤ 1</span><div class="grid2" style="margin-top:1.2vw"><div class="card"><h2 style="font-size:2vw">a) Viết dưới dạng lũy thừa</h2><div class="formula">\\(3\\cdot3\\cdot3\\cdot3\\cdot3=3^5\\)</div><p class="body">Cơ số là <b>3</b>, số mũ là <b>5</b>.</p></div><div class="card"><h2 style="font-size:2vw">b) Tính \\(11^2\\)</h2><div class="formula">\\(11^2=11\\cdot11=121\\)</div><p class="body">Bình phương của 11 là <b>121</b>.</p></div></div><div class="note" style="margin-top:1.3vw"><b>Chú ý:</b> \\(a^1=a\\). \\(a^2\\) gọi là <b>bình phương</b>; \\(a^3\\) gọi là <b>lập phương</b>.</div></div>`},
{question:true,html:`<div class="content"><span class="section">LUYỆN TẬP 1 · BẢNG BÌNH PHƯƠNG</span><p class="body">Hãy chọn giá trị đúng của \\(7^2\\).</p><div class="quiz" data-q="49"><button class="option" data-v="14">14</button><button class="option" data-v="49">49</button><button class="option" data-v="21">21</button><button class="option" data-v="77">77</button></div><div class="feedback"></div><div class="note" style="margin-top:1vw">Bảng bình phương từ 1 đến 10: \\(1^2,2^2,3^2,\\ldots,10^2\\).</div></div>`},
{html:`<div class="content"><span class="section">LUYỆN TẬP 1 · KHÁM PHÁ NHANH</span><h2 style="font-size:2.2vw">Bảng bình phương từ 1 đến 10</h2><table class="mini-table"><tr><th>\\(a\\)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><th>\\(a^2\\)</th><td>1</td><td>4</td><td>9</td><td>16</td><td>25</td><td>36</td><td>49</td><td>64</td><td>81</td><td>100</td></tr></table><div class="grid2" style="margin-top:1.2vw"><div class="card"><b>Vận dụng:</b><p class="body">Ô thứ 7 của bàn cờ có \\(2^6=64\\) hạt thóc.</p></div><div class="card"><b>Gợi ý:</b><p class="body">Mỗi lần sang ô kế tiếp, số hạt được nhân 2.</p></div></div></div>`},
{question:true,html:`<div class="content"><span class="section">TRÒ CHƠI · THẺ LẬT</span><p class="body">Chạm vào từng thẻ để lật và kiểm tra giá trị.</p><div class="flipgrid">${[['2^3','8'],['3^2','9'],['5^2','25']].map(x=>`<div class="flip"><div class="flipin"><div class="face front">\\(${x[0]}\\)</div><div class="face back">\\(${x[1]}\\)</div></div></div>`).join('')}</div><div class="feedback" id="flipFeedback"></div></div>`},
{question:true,html:`<div class="content"><span class="section">2. NHÂN HAI LŨY THỪA CÙNG CƠ SỐ</span><h2 style="font-size:2.3vw">Ghép quy tắc với ví dụ đúng</h2><div class="match"><div class="matchcol"><div class="matchitem" data-id="r1">Giữ nguyên cơ số</div><div class="matchitem" data-id="r2">Cộng các số mũ</div></div><div class="matchcol"><div class="matchitem" data-id="e2">\\(5^6\\cdot5^3=5^9\\)</div><div class="matchitem" data-id="e1">Cơ số của tích vẫn là 5</div></div></div><div class="feedback" id="matchFeedback"></div><div class="formulaBox formula">\\(a^m\\cdot a^n=a^{m+n}\\)</div></div>`},
{html:`<div class="content"><span class="section">VÍ DỤ 2</span><div class="grid2" style="margin-top:1.2vw"><div class="card"><div class="formula">\\(5^6\\cdot5^3=5^{6+3}=5^9\\)</div><p class="body">Cùng cơ số 5 → giữ nguyên 5; cộng số mũ 6 và 3.</p></div><div class="card"><div class="formula">\\(10^5\\cdot10^4\\cdot10^2=10^{5+4+2}=10^{11}\\)</div><p class="body">Có nhiều lũy thừa cùng cơ số, ta cộng tất cả các số mũ.</p></div></div><div class="note" style="margin-top:1.3vw"><b>Quy tắc:</b> Nhân hai lũy thừa cùng cơ số: giữ nguyên cơ số và cộng các số mũ.</div></div>`},
{question:true,html:`<div class="content"><span class="section">LUYỆN TẬP 2 · ĐIỀN KẾT QUẢ</span><h2 style="font-size:2vw">Điền số mũ còn thiếu</h2><div class="fillrow">\\(5^3\\cdot5^7=5^{\square}\\)<input class="input" id="fill1" inputmode="numeric"></div><div class="fillrow">\\(2^4\\cdot2^5\\cdot2^9=2^{\square}\\)<input class="input" id="fill2" inputmode="numeric"></div><button class="primary" id="checkFill">Kiểm tra</button><div class="feedback" id="fillFeedback"></div></div>`},
{question:true,html:`<div class="content"><span class="section">3. CHIA HAI LŨY THỪA CÙNG CƠ SỐ</span><h2 style="font-size:2.2vw">Chọn cách biến đổi đúng của \\(6^5:6^3\\)</h2><div class="formulaBox formula">\\(6^5:6^3=6^{5-3}=6^2\\)</div><div class="quiz" data-q="b"><button class="option" data-v="a">Giữ nguyên cơ số, cộng số mũ</button><button class="option" data-v="b">Giữ nguyên cơ số, lấy số mũ trừ nhau</button><button class="option" data-v="c">Cộng cơ số, trừ số mũ</button><button class="option" data-v="d">Chia cả cơ số và số mũ</button></div><div class="feedback"></div></div>`},
{html:`<div class="content"><span class="section">QUY TẮC CHIA</span><div class="center"><div><div class="formulaBox formula">\\(a^m:a^n=a^{m-n}\\quad(a\\ne0,\\ m\\ge n)\\)</div><div class="note" style="margin-top:1.3vw"><b>Chú ý:</b> Người ta quy ước \\(a^0=1\\) với \\(a\\ne0\\).</div><div class="grid2" style="margin-top:1.3vw"><div class="card"><div class="formula">\\(2^6:2^3=2^3\\)</div></div><div class="card"><div class="formula">\\(10^7:10^4=10^3\\)</div></div></div></div></div></div>`},
{question:true,html:`<div class="content"><span class="section">HOẠT ĐỘNG 3 · PHÂN LOẠI NHANH</span><h2 style="font-size:2.1vw">Chọn các biểu thức áp dụng được quy tắc chia hai lũy thừa cùng cơ số</h2><div class="sort" id="sortArea"><div class="sortitem" data-ok="1">\\(7^6:7^4\\)</div><div class="sortitem" data-ok="1">\\(10^8:10^3\\)</div><div class="sortitem" data-ok="0">\\(2^3:3^2\\)</div><div class="sortitem" data-ok="1">\\(6^5:6^2\\)</div><div class="sortitem" data-ok="0">\\(5^2\\cdot5^3\\)</div></div><button class="primary" id="checkSort">Chốt đáp án</button><div class="feedback" id="sortFeedback"></div></div>`},
{question:true,html:`<div class="content"><span class="section">VẬN DỤNG · THỰC TIỄN</span><h2 style="font-size:2.2vw">Mặt Trời “ăn” hydrogen nhanh đến mức nào?</h2><div class="grid2" style="align-items:center"><div class="card"><p class="body">Theo bài học, Mặt Trời tiêu thụ khoảng \\(6\\cdot10^6\\) tấn hydrogen mỗi giây. Khối lượng Trái Đất khoảng \\(60\\cdot10^{20}\\) tấn.</p><p class="body">Nếu chỉ xét phép chia khối lượng cho tốc độ tiêu thụ, kết quả dạng lũy thừa là?</p></div><div class="quiz" data-q="b"><button class="option" data-v="a">\\(10^{14}\\)</button><button class="option" data-v="b">\\(10^{15}\\)</button><button class="option" data-v="c">\\(10^{26}\\)</button><button class="option" data-v="d">\\(10^{12}\\)</button></div></div><div class="feedback"></div></div>`},
{html:`<div class="content"><span class="section">EM CÓ BIẾT?</span><div class="hero"><div><h2 style="font-size:2.6vw">Lũy thừa xuất hiện cả trong âm nhạc</h2><p class="body">Theo nội dung bài học, quan hệ về trường độ của các nốt nhạc có thể biểu diễn bằng các lũy thừa của 2:</p><div class="formulaBox formula">\\(1\\ tròn=2^1\\ trắng=2^2\\ đen=2^3\\ móc\\ đơn=2^4\\ móc\\ kép\\)</div><p class="body">Một cách thú vị để thấy toán học kết nối với thế giới xung quanh.</p></div><div class="object" style="position:relative"><span style="font-size:7vw">♪</span><span style="position:absolute;right:15%;top:12%;font-size:3vw;color:#ef3d32">2<sup>n</sup></span><span style="position:absolute;left:13%;bottom:10%;font-size:2.4vw;color:#08a9dc">♫</span></div></div></div>`},
{html:`<div class="content"><span class="section">GHI NHỚ · DẶN DÒ</span><h2 style="font-size:2.4vw">Ba điều cần nhớ</h2><div class="memory"><div class="card"><h3>1. Lũy thừa</h3><p>\\(a^n\\) là tích của \\(n\\) thừa số bằng nhau, mỗi thừa số bằng \\(a\\).</p></div><div class="card"><h3>2. Nhân cùng cơ số</h3><p>\\(a^m\\cdot a^n=a^{m+n}\\).</p></div><div class="card"><h3>3. Chia cùng cơ số</h3><p>\\(a^m:a^n=a^{m-n}\\), với \\(a\\ne0, m\\ge n\\).</p></div></div><div class="note" style="margin-top:1.3vw"><b>Dặn dò:</b> Làm các bài tập 1.36 → 1.45; luyện viết tích dưới dạng lũy thừa, tính lũy thừa, nhân và chia các lũy thừa cùng cơ số.</div><div class="center" style="height:25%"><div class="big">TỐT LẮM!</div></div></div>`}
];

const deck=document.getElementById('deck');
slides.forEach((s,i)=>{
 const el=document.createElement('section');
 el.className='slide'+(i===0?' active':'')+(s.cover?' cover':'');
 el.dataset.index=i;el.innerHTML=s.html;
 const foot=document.createElement('div');foot.className='footer';foot.textContent='TOÁN 6 · BÀI 6 · LŨY THỪA VỚI SỐ MŨ TỰ NHIÊN';
 el.appendChild(foot);deck.appendChild(el);
});
const progress=document.createElement('div');progress.className='progress';progress.innerHTML='<div class="bar"></div>';deck.appendChild(progress);
const counter=document.createElement('div');counter.className='counter';deck.appendChild(counter);
const timer=document.createElement('div');timer.className='timer';deck.appendChild(timer);

let current=0,startedAt=performance.now(),waiting=false;
const duration=5000;
function setCurrent(n){
 slideSound();
 const ss=deck.querySelectorAll('.slide');if(n<0||n>=ss.length)return;
 ss[current].classList.remove('active');current=n;ss[current].classList.add('active');
 waiting=!!slides[current].question;startedAt=performance.now();updateUI();
 if(window.MathJax)MathJax.typesetPromise([ss[current]]).catch(()=>{});
 bindInteractions(ss[current]);
}
function updateUI(){
 counter.textContent=`${current+1} / ${slides.length}`;
 document.querySelector('.bar').style.width=`${(current/(slides.length-1))*100}%`;
 timer.textContent=waiting?'ĐANG CHỜ TRẢ LỜI':'TỰ ĐỘNG CHUYỂN';
}
function next(){if(waiting)return;if(current<slides.length-1)setCurrent(current+1);else setCurrent(0)}
function tick(){
 if(waiting){timer.textContent='CHỌN ĐÁP ÁN ĐÚNG';return}
 const left=Math.max(0,duration-(performance.now()-startedAt));
 timer.textContent=`${(left/1000).toFixed(1)}s`;if(left<=0)next();
}
let audioCtx=null;
function getAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,dur,type='sine',gain=.045,delay=0){const c=getAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);const t=c.currentTime+delay;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02)}
function beep(ok=true){
 if(ok){
   // Âm thanh đúng: 3 nốt tăng dần, tạo cảm giác hoàn thành.
   tone(660,.12,'sine',.06);tone(880,.16,'sine',.055,.10);tone(1047,.22,'sine',.05,.22);
 }else{
   // Âm thanh sai: 2 nốt trầm giảm dần, ngắn và không gây khó chịu.
   tone(300,.16,'triangle',.06);tone(190,.24,'triangle',.05,.13);
 }
}
function wrongSound(){
 // Hiệu ứng riêng cho thao tác sai: "boop-boop" rõ ràng.
 tone(260,.12,'square',.035);
 tone(175,.18,'triangle',.045,.12);
}
function clickSound(){tone(560,.055,'sine',.025)}
function slideSound(){
 // Hiệu ứng chuyển slide: 3 nốt nhẹ, ngắn.
 tone(392,.08,'sine',.032);
 tone(523,.09,'sine',.028,.07);
 tone(659,.12,'sine',.024,.14);
}
function celebrate(){const symbols=['+','−','×','÷','²','³','√','∑','π'];for(let i=0;i<8;i++){const el=document.createElement('span');el.className='math-particle';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];el.style.left=(35+Math.random()*30)+'%';el.style.top=(45+Math.random()*18)+'%';el.style.animationDelay=(Math.random()*.18)+'s';deck.appendChild(el);setTimeout(()=>el.remove(),2500)}for(let i=0;i<18;i++){const el=document.createElement('span');el.className='confetti';el.style.left='50%';el.style.top='48%';el.style.setProperty('--dx',(Math.random()*500-250)+'px');el.style.setProperty('--dy',(Math.random()*260-100)+'px');deck.appendChild(el);setTimeout(()=>el.remove(),1400)}}
function correctSlide(){waiting=false;timer.textContent='CHÍNH XÁC';beep(true);celebrate();setTimeout(()=>{if(current<slides.length-1)setCurrent(current+1)},1800)}
function bindInteractions(slide){
 slide.querySelectorAll('.quiz').forEach(q=>q.querySelectorAll('.option').forEach(b=>b.onclick=()=>{clickSound();
   const ok=(q.dataset.q||'')===(b.dataset.v||b.textContent.trim());
   q.querySelectorAll('.option').forEach(x=>x.classList.remove('wrong','correct'));b.classList.add(ok?'correct':'wrong');
   const f=slide.querySelector('.feedback');if(f)f.textContent=ok?'Chính xác.':'Chưa đúng. Hãy thử lại.';
   if(ok){beep(true);correctSlide()}else{wrongSound()}
 }));
 slide.querySelectorAll('.flip').forEach(x=>x.onclick=()=>{
   x.classList.toggle('flipped');const all=[...slide.querySelectorAll('.flip')];
   if(all.every(v=>v.classList.contains('flipped'))){const f=slide.querySelector('#flipFeedback');if(f)f.textContent='Hoàn thành.';correctSlide()}
 });
 const pairs={r1:'e1',r2:'e2'};let selected=null,matched=0;
 slide.querySelectorAll('.matchitem').forEach(x=>x.onclick=()=>{
   if(x.classList.contains('done'))return;
   if(!selected){selected=x;x.classList.add('selected');return}
   const a=selected,b=x;
   if(a.parentElement===b.parentElement){a.classList.remove('selected');selected=null;return}
   const ok=pairs[a.dataset.id]===b.dataset.id||pairs[b.dataset.id]===a.dataset.id;a.classList.remove('selected');
   if(ok){a.classList.add('done');b.classList.add('done');matched++;beep(true);if(matched===2){const f=slide.querySelector('#matchFeedback');if(f)f.textContent='Ghép đúng: giữ nguyên cơ số và cộng các số mũ.';correctSlide()}}
   else{b.classList.add('selected');setTimeout(()=>b.classList.remove('selected'),400);wrongSound()}selected=null;
 });
 const fill=slide.querySelector('#checkFill');
 if(fill)fill.onclick=()=>{
   const a=slide.querySelector('#fill1'),b=slide.querySelector('#fill2'),ok=a.value.trim()==='10'&&b.value.trim()==='18';
   [a,b].forEach(x=>x.classList.remove('ok','bad'));a.classList.add(a.value.trim()==='10'?'ok':'bad');b.classList.add(b.value.trim()==='18'?'ok':'bad');
   slide.querySelector('#fillFeedback').textContent=ok?'Chính xác: 3+7=10 và 4+5+9=18.':'Chưa đúng. Gợi ý: cộng các số mũ.';
   if(ok){beep(true);correctSlide()}else{wrongSound()}
 };
 const sort=slide.querySelector('#sortArea');
 if(sort){
   sort.querySelectorAll('.sortitem').forEach(x=>x.onclick=()=>x.classList.toggle('selected'));
   slide.querySelector('#checkSort').onclick=()=>{
     let ok=true;sort.querySelectorAll('.sortitem').forEach(x=>{const sel=x.classList.contains('selected'),need=x.dataset.ok==='1';if(sel!==need)ok=false;x.classList.toggle('correct',sel&&need)});
     slide.querySelector('#sortFeedback').textContent=ok?'Chính xác.':'Có lựa chọn chưa đúng. Hãy phân loại lại.';
     if(ok){beep(true);correctSlide()}else{wrongSound()}
   };
 }
}
updateUI();bindInteractions(deck.querySelector('.slide'));setInterval(tick,100);
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!waiting){e.preventDefault();next()}});
</script>
</body>
</html>
